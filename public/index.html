<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Registro Rena Ware · Ventas y Afiliados</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bitter:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --azul:#0E3A5D;
    --azul-claro:#155A8A;
    --vapor:#F2F6F8;
    --acero:#DCE6EC;
    --acero-brillo:#EAF1F5;
    --tinta:#1B2733;
    --tinta-suave:#51616F;
    --exito:#1E7A46;
    --error:#B3372B;
    --ambar:#8A6100;
    --ambar-fondo:#FFF4D6;
    --blanco:#FFFFFF;
    --radio:20px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:'Atkinson Hyperlegible',system-ui,sans-serif;
    font-size:19px;
    color:var(--tinta);
    background:var(--vapor);
    display:flex;
    flex-direction:column;
    height:100dvh;
    overflow:hidden;
  }

  /* ---------- Header ---------- */
  header{
    background:var(--azul);
    color:var(--blanco);
    padding:12px 16px 9px;
    flex-shrink:0;
    box-shadow:0 2px 8px rgba(14,58,93,.25);
  }
  .header-top{display:flex;align-items:center;gap:12px}
  .avatar-header{
    width:42px;height:42px;border-radius:50%;
    background:linear-gradient(160deg,#1D6395,#0E3A5D);
    display:flex;align-items:center;justify-content:center;
    font-size:23px;flex-shrink:0;
    border:2px solid rgba(255,255,255,.35);
  }
  .header-title{font-family:'Bitter',serif;font-weight:700;font-size:19px;line-height:1.2}
  .header-sub{font-size:13.5px;opacity:.85;margin-top:1px}
  .progreso-wrap{margin-top:8px;display:flex;align-items:center;gap:10px}
  .btn-atras{
    display:none;align-items:center;gap:2px;
    background:rgba(255,255,255,.18);color:#fff;border:1.5px solid rgba(255,255,255,.35);
    border-radius:99px;padding:5px 13px;font:inherit;font-size:14.5px;font-weight:700;
    cursor:pointer;flex-shrink:0;-webkit-tap-highlight-color:transparent;
  }
  .btn-atras:active{background:rgba(255,255,255,.32)}
  /* ---- Pestaña de estado: mirar lo registrado y corregir un dato ---- */
  .hoja-fondo{position:fixed;inset:0;z-index:90;background:rgba(10,20,30,.55);
    display:flex;align-items:flex-end;justify-content:center;animation:apareceF .16s ease}
  @keyframes apareceF{from{opacity:0}to{opacity:1}}
  .hoja{background:#fff;width:100%;max-width:620px;max-height:88vh;border-radius:18px 18px 0 0;
    display:flex;flex-direction:column;box-shadow:0 -8px 40px rgba(0,0,0,.28);
    animation:subeH .2s cubic-bezier(.2,.8,.3,1)}
  @keyframes subeH{from{transform:translateY(22px)}to{transform:translateY(0)}}
  .hoja-cab{display:flex;align-items:flex-start;gap:10px;padding:14px 16px 10px;
    border-bottom:1px solid #E6EDF2;flex-shrink:0}
  .hoja-cab b{font-size:16px}
  .hoja-sub{font-size:12px;color:#6B7E8C;margin-top:2px;line-height:1.35}
  .hoja-x{margin-left:auto;background:#F1F5F8;border:none;border-radius:50%;width:32px;height:32px;
    font-size:15px;color:#4A5A66;cursor:pointer;flex-shrink:0}
  .hoja-cuerpo{overflow:auto;-webkit-overflow-scrolling:touch;padding:4px 0;flex:1}
  .hoja-fila{display:flex;align-items:baseline;gap:8px;width:100%;text-align:left;
    background:none;border:none;border-bottom:1px solid #F0F4F7;
    padding:11px 16px;font:inherit;cursor:pointer;min-height:46px}
  .hoja-fila:active{background:#F5F9FC}
  .hoja-fila.sin-accion{cursor:default;opacity:.75}
  .hoja-et{font-size:12.5px;color:#6B7E8C;flex:0 0 38%;line-height:1.3}
  .hoja-val{font-size:14px;color:#17323F;flex:1;word-break:break-word;line-height:1.35}
  .hoja-val.vacio{color:#B3C0C9;font-style:italic}
  .hoja-lapiz{font-size:13px;opacity:.5;flex-shrink:0}
  .hoja-pie{padding:10px 14px 14px;border-top:1px solid #E6EDF2;flex-shrink:0;
            display:flex;flex-direction:column;gap:8px}
  .hoja-pie .chip{width:100%}
  .progreso-barra{flex:1;height:8px;background:rgba(255,255,255,.25);border-radius:99px;overflow:hidden}
  .progreso-fill{height:100%;width:0%;background:linear-gradient(90deg,#7FC4EE,#BFE3F7);border-radius:99px;transition:width .5s ease}
  .progreso-texto{font-size:14px;font-weight:700;white-space:nowrap;opacity:.95}

  .aviso-falta{
    background:#FDECEC;border:1.5px solid #E9A9A9;border-radius:16px;
    padding:14px 16px;font-size:15.5px;color:#7A1F1F;line-height:1.45;
  }
  .aviso-pend{
    background:var(--ambar-fondo);border:1.5px solid rgba(160,110,0,.3);border-radius:16px;
    padding:14px 16px;font-size:15.5px;color:var(--ambar);line-height:1.45;
  }
  .aviso-falta ul,.aviso-pend ul{margin:6px 0 0;padding-left:20px}
  .aviso-falta li,.aviso-pend li{margin:2px 0}
  .inp-buscar{
    width:100%;border:1.5px solid var(--acero);border-radius:12px;padding:11px 14px;
    font:inherit;font-size:16.5px;outline:none;background:#fff;
  }
  .inp-buscar:focus{box-shadow:0 0 0 3px rgba(14,58,93,.13)}
  .resultados{max-height:34dvh;overflow-y:auto;margin-top:8px;-webkit-overflow-scrolling:touch}
  .item-prod{
    display:flex;flex-direction:column;gap:3px;width:100%;text-align:left;
    background:#fff;border:1.5px solid var(--acero-borde,#C9D6E0);border-radius:11px;
    padding:9px 13px;margin-bottom:7px;font:inherit;cursor:pointer;
  }
  .item-prod:active{background:#EAF2F8}
  .item-prod.ya{border-color:#0C7461;background:#F1F9F6}
  .item-prod.ya .ip-n:after{content:' ✓';color:#0C7461}
  .ip-n{font-size:15.5px;font-weight:700;line-height:1.25}
  .ip-m{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .ip-c{font-size:12.5px;color:#5D7183;font-variant-numeric:tabular-nums}
  /* El código va delante del nombre y se distingue por color, no por tamaño:
     es lo primero que se lee para no confundir dos especiales parecidos. */
  .ip-cod{color:#5D7183;font-variant-numeric:tabular-nums;font-weight:700}
  /* El regalo del especial: se lee, pero no compite con el producto */
  .ip-reg{display:block;font-size:13px;font-weight:600;color:#0C7461;margin-top:3px;line-height:1.3}
  .ip-p{font-size:15px;font-weight:700;color:var(--azul,#0E3A5D);font-variant-numeric:tabular-nums;margin-left:auto}
  .sin-res{padding:16px 4px;color:#5D7183;font-size:15px;text-align:center}
  .banner-guardado{
    background:#EAF4FB;color:#0E3A5D;
    font-size:12.5px;font-weight:600;text-align:center;
    padding:5px 12px;flex-shrink:0;line-height:1.35;
    border-bottom:1px solid rgba(14,58,93,.12);
  }
  .banner-demo{
    background:var(--ambar-fondo);color:var(--ambar);
    font-size:12.5px;font-weight:700;text-align:center;
    padding:4px 10px;flex-shrink:0;letter-spacing:.3px;
  }

  /* ---------- Chat ---------- */
  #chat{
    flex:1;overflow-y:auto;
    padding:16px 12px 22px;
    display:flex;flex-direction:column;gap:13px;
    scroll-behavior:smooth;
  }
  @media (prefers-reduced-motion:reduce){
    #chat{scroll-behavior:auto}
    .msg,.dock-inner,.resumen{animation:none !important}
  }
  .fila{display:flex;gap:8px;align-items:flex-end}
  .fila.bot{justify-content:flex-start}
  .fila.user{justify-content:flex-end}
  .avatar-bot{
    width:34px;height:34px;border-radius:50%;
    background:linear-gradient(160deg,#1D6395,#0E3A5D);
    display:flex;align-items:center;justify-content:center;
    font-size:18px;flex-shrink:0;
    border:1.5px solid #C6D9E6;
  }
  .msg{
    max-width:84%;
    padding:12px 15px;
    border-radius:var(--radio);
    line-height:1.42;
    animation:entrar .22s ease both;
    word-wrap:break-word;
  }
  @keyframes entrar{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .msg.bot{
    background:var(--blanco);
    border:1.5px solid var(--acero);
    border-bottom-left-radius:6px;
    color:var(--tinta);
    box-shadow:0 1px 3px rgba(14,58,93,.06);
  }
  .msg.user{
    background:linear-gradient(165deg,var(--acero-brillo),var(--acero));
    border:1.5px solid #C9D8E2;
    border-bottom-right-radius:6px;
    color:var(--tinta);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 1px 3px rgba(14,58,93,.08);
    font-weight:700;
  }
  .msg.error-msg{border-color:#E4B7B1;background:#FDF3F2;color:var(--error)}
  .msg .peque{font-size:15px;color:var(--tinta-suave);display:block;margin-top:5px;font-weight:400}
  /* El mismo subtexto dentro de un chip: en el selector de registros va debajo
     del título, no pegado a él. */
  .chip .peque{display:block;margin-top:3px;font-size:12.5px;opacity:.72;font-weight:400}

  .typing{display:inline-flex;gap:5px;padding:4px 2px}
  .typing span{width:8px;height:8px;border-radius:50%;background:#9FB6C6;animation:puls 1s infinite}
  .typing span:nth-child(2){animation-delay:.15s}
  .typing span:nth-child(3){animation-delay:.3s}
  @keyframes puls{0%,100%{opacity:.3;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}

  /* ---------- Tarjeta resumen (compacta) ---------- */
  .fila-resumen{display:flex}
  .resumen{
    background:var(--blanco);
    border:1.5px solid var(--acero);
    border-radius:var(--radio);
    padding:12px 14px;
    width:100%;
    animation:entrar .22s ease both;
    box-shadow:0 2px 8px rgba(14,58,93,.08);
  }
  .resumen h3{font-family:'Bitter',serif;font-size:16.5px;color:var(--azul);margin-bottom:6px}
  .res-item{padding:5px 0;border-bottom:1px dashed var(--acero)}
  .res-item:last-child,.res-grid .res-item{border-bottom:none}
  .res-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px;border-bottom:1px dashed var(--acero)}
  .res-label{font-size:12px;color:var(--tinta-suave);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
  .res-valor{font-size:16.5px;font-weight:700;margin-top:1px;line-height:1.3}
  .res-foto{width:78px;border-radius:10px;border:1.5px solid var(--acero);display:block;margin-top:3px}

  /* ---------- Éxito ---------- */
  .exito-card{
    background:var(--blanco);
    border:2px solid #BCDCC9;
    border-radius:var(--radio);
    padding:20px 16px;
    text-align:center;
    width:100%;
    animation:entrar .3s ease both;
  }
  .check{
    width:60px;height:60px;margin:0 auto 10px;border-radius:50%;
    background:var(--exito);color:#fff;font-size:32px;
    display:flex;align-items:center;justify-content:center;
    animation:pop .45s cubic-bezier(.3,1.5,.6,1) both;
  }
  @keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
  .exito-card h3{font-family:'Bitter',serif;color:var(--exito);font-size:20px;margin-bottom:5px}
  .exito-card p{color:var(--tinta-suave);font-size:16.5px;line-height:1.45}

  /* ---------- Dock de entrada ---------- */
  #dock{
    flex-shrink:0;
    background:var(--blanco);
    border-top:1.5px solid var(--acero);
    padding:10px 14px calc(10px + env(safe-area-inset-bottom));
    box-shadow:0 -3px 12px rgba(14,58,93,.07);
  }
  .dock-inner{animation:entrar .2s ease both}
  .fila-input{display:flex;gap:10px;align-items:stretch}
  input[type=text],input[type=tel],input[type=email],textarea{
    flex:1;
    font-family:inherit;
    font-size:19px;
    padding:13px 15px;
    border:2px solid var(--acero);
    border-radius:16px;
    background:var(--vapor);
    color:var(--tinta);
    outline:none;
    min-height:54px;
  }
  textarea{resize:none;line-height:1.4}
  input:focus,textarea:focus,select:focus{border-color:var(--azul-claro);background:#fff}
  .btn-enviar{
    width:54px;min-width:54px;border-radius:16px;border:none;
    background:var(--azul);color:#fff;font-size:22px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;transition:transform .1s,background .15s;
  }
  .btn-enviar:active{transform:scale(.94);background:var(--azul-claro)}

  .chips{display:flex;flex-direction:column;gap:9px;max-height:44dvh;overflow-y:auto}
  .chips.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .chips.grid2 .chip{font-size:16.5px;padding:12px 10px;min-height:52px}
  .chips.grid2 .chip.ancho{grid-column:1/-1}
  .chip{
    width:100%;
    padding:14px 16px;
    font-family:inherit;font-size:19px;font-weight:700;
    background:var(--vapor);
    border:2px solid var(--azul-claro);
    color:var(--azul);
    border-radius:16px;
    cursor:pointer;
    min-height:54px;
    text-align:center;
    transition:transform .1s,background .15s;
  }
  .chip:active{transform:scale(.97);background:var(--acero)}
  .chip.primario{background:var(--azul);color:#fff;border-color:var(--azul)}
  .chip.exito-btn{background:var(--exito);color:#fff;border-color:var(--exito)}
  .chip.secund{border-color:var(--acero);color:var(--tinta-suave);font-weight:400}

  .btn-foto{
    width:100%;
    padding:17px;
    font-family:inherit;font-size:20px;font-weight:700;
    background:var(--azul);color:#fff;
    border:none;border-radius:16px;
    cursor:pointer;min-height:60px;
    transition:transform .1s;
  }
  .btn-foto:active{transform:scale(.97)}
  .foto-preview-wrap{display:flex;gap:12px;align-items:center;margin-bottom:10px}
  .foto-preview{width:72px;height:72px;object-fit:cover;border-radius:12px;border:2px solid var(--acero)}
  .foto-preview-txt{font-size:15.5px;color:var(--tinta-suave);flex:1;line-height:1.35}

  /* ---------- Selects de ubicación ---------- */
  .ubi-label{font-size:13px;font-weight:700;color:var(--tinta-suave);text-transform:uppercase;letter-spacing:.4px;margin:0 0 3px 4px}
  select{
    width:100%;
    font-family:inherit;font-size:18px;font-weight:700;
    padding:12px 14px;
    border:2px solid var(--acero);
    border-radius:14px;
    background:var(--vapor);
    color:var(--tinta);
    min-height:52px;
    margin-bottom:8px;
    outline:none;
  }
  .oculto{display:none !important}
</style>
</head>
<body>

<header>
  <div class="header-top">
    <div class="avatar-header">📋</div>
    <div>
      <div class="header-title">Registro Rena Ware</div>
      <div class="header-sub">Ventas y afiliados · Equipo Arequipa</div>
    </div>
  </div>
  <div class="progreso-wrap">
    <button id="btnAtras" class="btn-atras" type="button">‹ Atrás</button>
    <button id="btnEstado" class="btn-atras" type="button" title="Ver y corregir lo ya registrado">📋 Ver</button>
    <button id="btnRegistros" class="btn-atras" type="button" title="Otros registros a medio llenar">⇄</button>
    <div class="progreso-barra"><div class="progreso-fill" id="progFill"></div></div>
    <div class="progreso-texto" id="progTxt">Paso 1</div>
  </div>
</header>
<div class="banner-demo">Equipo Arequipa · Rena Ware</div>
<div class="banner-guardado">💾 Tu avance se guarda solo. ¿Varios a la vez? Abre este link en otra pestaña: cada una lleva su registro.</div>

<main id="chat" aria-live="polite"></main>

<div id="dock"><div class="dock-inner" id="dockInner"></div></div>

<input type="file" id="fileInput" accept="image/*,.pdf,application/pdf" class="oculto">
<input type="file" id="sustentoInput" accept="image/*,.pdf,.xls,.xlsx,application/pdf" multiple class="oculto">

/* ---------- Borrador automático (se guarda en este mismo celular) ---------- */
function lsSet(k,v){ try{ localStorage.setItem(k,v); return true; }catch(e){ return false; } }
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }
/* Había un solo borrador, así que empezar una afiliación pisaba la venta a
   medio llenar y había que terminar una antes de tocar la otra. Ahora conviven
   varios en el mismo equipo y se alterna entre ellos. El de antes se migra
   solo la primera vez. */
const CLAVE_BORRADORES = 'rw_borradores';
const MAX_BORRADORES = 6;
let borradorActual = null;

/* ---------- Varias pestañas a la vez ----------
   Los borradores viven en localStorage, que TODAS las pestañas comparten. Lo
   que no se comparte es sessionStorage: es de cada pestaña y aguanta una
   recarga. Ahí se apunta cuál registro está llenando esta pestaña, y con eso:
     · recargar o volver a esta pestaña retoma SU registro, sin preguntar;
     · abrir una pestaña nueva ofrece la lista para elegir o empezar otro;
     · dos pestañas no se pisan, porque cada una sabe cuál es el suyo.
   Además cada pestaña firma su borrador (quién y cuándo) para avisar si se
   intenta abrir en dos sitios a la vez. */
function ssSet(k,v){ try{ sessionStorage.setItem(k,v); }catch(e){} }
function ssGet(k){ try{ return sessionStorage.getItem(k); }catch(e){ return null; } }
function ssDel(k){ try{ sessionStorage.removeItem(k); }catch(e){} }

const PESTANA = (function(){
  let id = ssGet('rw_pestana');
  if(!id){ id = 'p' + Date.now().toString(36) + Math.floor(Math.random()*1e6).toString(36); ssSet('rw_pestana', id); }
  return id;
})();
const VIVO_MS = 45000;          // una firma más vieja que esto ya no cuenta
function fijaBorradorDePestana(id){
  borradorActual = id || null;
  if(id) ssSet('rw_pestana_borrador', id); else ssDel('rw_pestana_borrador');
}
function borradorDeEstaPestana(){ return ssGet('rw_pestana_borrador'); }
/* ¿Lo está llenando otra pestaña ahora mismo? */
function abiertoEnOtraPestana(b){
  return !!(b && b.pestana && b.pestana !== PESTANA &&
            (Date.now() - (b.visto||0)) < VIVO_MS);
}
/* Mientras esta pestaña esté viva, refresca su firma para que otra no crea

function leeBorradores(){
  let m = {};
  try{ m = JSON.parse(lsGet(CLAVE_BORRADORES) || '{}') || {}; }catch(e){ m = {}; }
  /* Migración del borrador único de la versión anterior */
  try{
    const viejo = lsGet('rw_borrador');
    if(viejo){
      const b = JSON.parse(viejo);
      if(b && b.cola && b.cola.length){
        const id = b.id || ('m'+Date.now());
        if(!m[id]){ b.id = id; b.actualizado = b.actualizado || Date.now(); m[id] = b; }
      }
      lsDel('rw_borrador');
      lsSet(CLAVE_BORRADORES, JSON.stringify(m));
    }
  }catch(e){}
  return m;
}
function escribeBorradores(m){
  if(lsSet(CLAVE_BORRADORES, JSON.stringify(m))) return true;
  /* Sin espacio: se aligeran los que NO se están llenando ahora. Las fotos del
     borrador activo se conservan todo lo que se pueda. */
  const aligera = b => {
    const c = JSON.parse(JSON.stringify(b));
    c.datos.constanciaDataUrl=''; c.datos.constancias=[]; c.datos.reciboFotoDataUrl='';
    (c.datos.fuentes||[]).forEach(f=>{ (f.sustentos||[]).forEach(s=>{ delete s.thumb; s.dataUrl=''; }); });
    c.sinFotos = true;
    return c;
  };
  try{
    const m2 = {};
    Object.keys(m).forEach(k=>{ m2[k] = (k === borradorActual) ? m[k] : aligera(m[k]); });
    if(lsSet(CLAVE_BORRADORES, JSON.stringify(m2))) return true;

    /* Si aún no entra, se sueltan los borradores viejos enteros, del más
       antiguo al más nuevo. Antes de esto se les quitaban las fotos A TODOS,
       incluido el que se está llenando: el recibo y las constancias
       desaparecían sin avisar y había que volver a subirlos al recargar.
       El que está en la mano no se toca nunca. */
    const viejos = Object.keys(m2)
      .filter(k => k !== borradorActual && !abiertoEnOtraPestana(m2[k]))
      .sort((a,b)=>(m2[a].actualizado||0)-(m2[b].actualizado||0));
    for(const k of viejos){
      delete m2[k];
      if(lsSet(CLAVE_BORRADORES, JSON.stringify(m2))) return true;
    }
    /* Ni así: se guarda el avance sin fotos para no perder lo escrito, y se
       dice en voz alta, porque las fotos siguen solo en esta pantalla. */
    const solo = {}; solo[borradorActual] = aligera(m2[borradorActual] || m[borradorActual]);
    const ok = lsSet(CLAVE_BORRADORES, JSON.stringify(solo));
    avisaSinEspacio();
    return ok;
  }catch(e){ return false; }
}

  const h = Math.round(min/60);
  if(h < 24)    return 'hace ' + h + (h===1 ? ' hora' : ' horas');

  return 'hace ' + d + (d===1 ? ' día' : ' días');
}

/* Forma corta y determinista del tiempo de empleo. El portal limita a 8 caracteres.
   Se deriva de los meses ya calculados; nunca se abrevia texto libre. */
function tiempoCortoRw(meses){
  const m = parseInt(meses,10);
  if(!m || m<1) return '';
  const a = Math.floor(m/12), r = m%12;
  if(a>0 && r>0) return a+'a '+r+'m';        // máx "70a 11m" = 7
  if(a>0)        return a+(a===1?' año':' años');  // máx "70 años" = 7
  return r+(r===1?' mes':' meses');          // máx "11 meses" = 8
}

/* Fecha de nacimiento. Se escribe como viene del sistema de Rena Ware —ocho
   números seguidos— y también se aceptan los separadores que salgan solos.
   Queda guardada en DD/MM/AAAA, que es como se lee; a ISO se convierte recién
   al enviar, porque la base la recibe como fecha. */
function validaNacimiento(v){
  const bruto = String(v).trim();
  const n = bruto.replace(/\D/g,'');
  let p = null;
  if(/^\d{8}$/.test(n)) p = [n.slice(0,2), n.slice(2,4), n.slice(4)];
  else{
    const m = bruto.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/);
    if(m) p = [m[1], m[2], m[3]];
  }
  if(!p) return {ok:false, msg:'Escríbela como <b>24081985</b> (día, mes y año seguidos) o <b>24/08/1985</b> 🙏'};
  const d=+p[0], mes=+p[1], a=+p[2];
  if(mes<1 || mes>12) return {ok:false, msg:'Ese mes no existe. Recuerda: primero el <b>día</b>, después el mes 🙏'};
  const f = new Date(Date.UTC(a, mes-1, d));
  if(f.getUTCFullYear()!==a || f.getUTCMonth()!==mes-1 || f.getUTCDate()!==d)
    return {ok:false, msg:'Esa fecha no existe en el calendario. Revísala, por favor 🙏'};
  const anios = (Date.now() - f.getTime()) / (365.25*24*3600*1000);
  if(anios < 18) return {ok:false, msg:'Esa fecha da <b>menos de 18 años</b>. Revísala, por favor 🙏'};
  if(anios > 100) return {ok:false, msg:'Esa fecha da más de <b>100 años</b>. Revísala, por favor 🙏'};
  return {ok:true, v: String(d).padStart(2,'0')+'/'+String(mes).padStart(2,'0')+'/'+a};
}

/* ================== UI: BURBUJAS ================== */
function burbujaBot(html, extraClase){
  return new Promise(res=>{
    const t = document.createElement('div');
    t.className='fila bot';
    t.innerHTML = '<div class="avatar-bot">📋</div><div class="msg bot"><span class="typing"><span></span><span></span><span></span></span></div>';
    chat.appendChild(t); scrollAbajo();
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    setTimeout(()=>{
      t.querySelector('.msg').outerHTML = '<div class="msg bot '+(extraClase||'')+'">'+html+'</div>';
      scrollAbajo(); res();
    }, reduce?0:480);
  });
}
function burbujaUser(texto){
  const d = document.createElement('div');
  d.className='fila user';
  const m = document.createElement('div');
  m.className='msg user'; m.textContent = texto;
  d.appendChild(m); chat.appendChild(d); scrollAbajo();
}
function burbujaUserFoto(dataUrl){
  const d = document.createElement('div');
  d.className='fila user';
  d.innerHTML = '<div class="msg user"><img src="'+dataUrl+'" style="width:120px;border-radius:12px;display:block"></div>';
  chat.appendChild(d); scrollAbajo();
}
function scrollAbajo(){ requestAnimationFrame(()=>{ chat.scrollTop = chat.scrollHeight; }); }

/* ================== PROGRESO ================== */
function pintaProgreso(){
  const pct = totalPasos ? Math.min(99, Math.round((pasosHechos/totalPasos)*100)) : 3;
  progTxt.textContent = pct+'%';
  progFill.style.width = Math.max(pct,3)+'%';
}

/* ================== DOCK ================== */
/* Mientras la siguiente burbuja se escribe, los botones de la pregunta
   anterior siguen en pantalla: un segundo toque —el de la prisa, o el que el
   dedo da solo— respondía DOS veces y el formulario saltaba un paso. Por eso
   el dock se cierra con el primer toque y se abre solo cuando se pinta el
   siguiente, que es lo que hace dockLimpiar(). */
let dockUsado = false, relojDock = null;
function dockLimpiar(){ sueltaDock(); dockInner.innerHTML=''; }
function tomaDock(){
  if(dockUsado) return false;
  dockUsado = true;
  dockInner.style.opacity = '.55';
  dockInner.style.pointerEvents = 'none';
  /* Si por algún camino no se vuelve a pintar el dock, se suelta solo: más
     vale un toque repetido que quedarse mirando botones muertos. */
  clearTimeout(relojDock);
  relojDock = setTimeout(sueltaDock, 6000);
  return true;
}
/* Algunos botones abren el selector de archivos y el dock tiene que seguir
   vivo por si se cancela: esos no lo cierran. */
function sueltaDock(){
  clearTimeout(relojDock);
  dockUsado = false;
  dockInner.style.opacity = '';
  dockInner.style.pointerEvents = '';
}

/* ---------- Historial: permite regresar un paso ---------- */
let historial = [];
let sinAtras = false;          // true en resumen/éxito
function clona(o){
  if(Array.isArray(o)) return o.map(clona);
  if(o && typeof o==='object'){ const r={}; for(const k in o) r[k]=clona(o[k]); return r; }
  return o;                     // strings (incluidas las fotos) por referencia
}
function marca(render){
  if(sinAtras) return;
  historial.push({
    datos: clona(datos),
    cola: cola.slice(),
    pasosHechos: pasosHechos,
    totalPasos: totalPasos,
    editando: editando,
    editandoDireccion: editandoDireccion,
    chatLen: chat.children.length,
    render: render
  });
  if(historial.length>60) historial.shift();
  pintaAtras();
}
function pintaAtras(){
  const b = document.getElementById('btnAtras');
  if(!b) return;
  b.style.display = (!sinAtras && historial.length>1) ? 'flex' : 'none';
  pintaBtnEstado();
  pintaBtnRegistros();
}
function irAtras(){
  if(historial.length<2) return;
  /* Si venía de una corrección abierta desde la pestaña y en vez de responder
     toca Atrás, manda la navegación a mano: se suelta el punto de regreso. */
  retomar = null;
  historial.pop();
  const s = historial[historial.length-1];
  /* Se retrocede en el RECORRIDO, no en los datos: si alguien vuelve atrás
     para corregir el celular, lo que ya respondió más adelante se conserva y
     al avanzar no tiene que volver a escribirlo. La respuesta que se corrige
     se sobrescribe sola al pasar de nuevo por ese paso. */
  cola = s.cola.slice();
  pasosHechos = s.pasosHechos;
  totalPasos = s.totalPasos;
  editando = s.editando;
  editandoDireccion = s.editandoDireccion;
  while(chat.children.length > s.chatLen) chat.removeChild(chat.lastChild);
  pintaProgreso();
  dockLimpiar();
  historial.pop();               // el render volverá a marcarlo
  s.render();
  scrollAbajo();
}
function dockTexto(paso, onDone){
  marca(()=>dockTexto(paso, onDone));
  dockLimpiar();
  const esArea = paso.tipo==='textarea';
  const wrap = document.createElement('div'); wrap.className='fila-input';
  const inp = esArea ? document.createElement('textarea') : document.createElement('input');
  if(!esArea){
    inp.type = paso.inputmode==='email' ? 'email' : (paso.inputmode==='tel'||paso.inputmode==='numeric') ? 'tel' : 'text';
    inp.inputMode = paso.inputmode||'text';
  } else { inp.rows = 2; }
  inp.placeholder = paso.placeholder||'';
  if(paso.valor != null) inp.value = paso.valor;   /* texto prellenado y editable */
  if(paso.maxlength) inp.maxLength = paso.maxlength;
  inp.autocomplete='off'; inp.enterKeyHint='send';

  /* Sugerencias en vivo: aparecen solo si hay coincidencia y no tapan nada.
     paso.sugerencias(texto) → [{t, sub, fn}] */
  let cajaSug = null, tSug = null;
  if(typeof paso.sugerencias === 'function'){
    cajaSug = document.createElement('div');
    cajaSug.className = 'sugerencias';
    cajaSug.style.cssText = 'display:none;margin:6px 0 0;max-height:190px;overflow:auto;'+
      'border:1px solid var(--borde,#e3e3e3);border-radius:10px;background:var(--fondo,#fff)';
    const pinta = async ()=>{
      const q = inp.value.trim();
      if(q.length < 2){ cajaSug.style.display='none'; cajaSug.innerHTML=''; return; }
      let items = [];
      try{ items = await paso.sugerencias(q); }catch(e){ items = []; }
      if(!items || !items.length){ cajaSug.style.display='none'; cajaSug.innerHTML=''; return; }
      cajaSug.innerHTML = '';
      items.slice(0,6).forEach(it=>{
        const b = document.createElement('button');
        b.type='button';
        b.style.cssText='display:block;width:100%;text-align:left;padding:9px 12px;border:0;'+
          'background:transparent;font-size:14px;cursor:pointer;border-bottom:1px solid var(--borde,#f0f0f0)';
        b.innerHTML = '<b>'+escapa(it.t)+'</b>'+(it.sub?'<span class="peque" style="display:block;margin:2px 0 0">'+escapa(it.sub)+'</span>':'');
        b.onclick = ()=>{ if(!tomaDock()) return; cajaSug.style.display='none'; it.fn(); };
        cajaSug.appendChild(b);
      });
      cajaSug.style.display='block';
    };
    inp.addEventListener('input', ()=>{ clearTimeout(tSug); tSug = setTimeout(pinta, 220); });
  }

  const btn = document.createElement('button');
  btn.className='btn-enviar'; btn.innerHTML='➤'; btn.setAttribute('aria-label','Enviar');
  if(cajaSug) setTimeout(()=>{ if(wrap.parentNode) wrap.parentNode.appendChild(cajaSug); }, 0);
  const continuar = onDone ? onDone : ()=>{ dockLimpiar(); if(paso.alTerminar){ paso.alTerminar(); } else if(editando){ editando=false; irResumen(); } else { avanzar(); } };
  const enviar = ()=>{
    const val = inp.value;
    if(!val.trim()) return;
    /* Un segundo envío mientras la siguiente pregunta se escribe mandaba la
       misma respuesta dos veces y saltaba un paso. */
    if(!tomaDock()) return;
    const r = paso.valida(val);
    if(!r.ok){
      burbujaUser(val.trim());
      if(r.sugerencia){
        burbujaBot('¿Quisiste decir <b>'+escapa(r.sugerencia)+'</b>?').then(()=>{
          dockChips([
            {t:'✅ Sí, usar ese correo', clase:'primario', fn:()=>{ paso.guarda(r.sugerencia); burbujaUser(r.sugerencia); continuar(); }},
            {t:'✏️ No, escribirlo de nuevo', clase:'secund', fn:()=>{ burbujaBot('Escríbelo de nuevo, por favor 👇').then(()=>dockTexto(paso, onDone)); }}
          ]);
        });
        return;
      }
      if(r.confirmar){
        burbujaBot('Ese correo termina en <b>@'+escapa(r.v.split('@')[1])+'</b>, que es poco común. ¿Está bien escrito?').then(()=>{
          dockChips([
            {t:'✅ Sí, es correcto', clase:'primario', fn:()=>{ paso.guarda(r.v); burbujaUser(r.v); continuar(); }},
            {t:'✏️ No, escribirlo de nuevo', clase:'secund', fn:()=>{ burbujaBot('Escríbelo de nuevo, por favor 👇').then(()=>dockTexto(paso, onDone)); }}
          ]);
        });
        return;
      }
      burbujaBot(r.msg,'error-msg').then(()=>{ inp.value=''; inp.focus(); });
      return;
    }
    paso.guarda(r.v);
    burbujaUser(r.v);
    dockLimpiar();
    continuar();
  };
  btn.addEventListener('click',enviar);
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter' && !esArea){ e.preventDefault(); enviar(); } });
  wrap.appendChild(inp); wrap.appendChild(btn); dockInner.appendChild(wrap);
  if(paso.omitir){
    const om = document.createElement('button');
    om.className='chip secund'; om.style.marginTop='8px';
    om.textContent = paso.omitirTxt || '⏭️ Omitir por ahora';
    om.addEventListener('click',()=>{ burbujaUser(paso.omitirTxt || '⏭️ Omitir por ahora'); dockLimpiar(); paso.omitir(); });
    dockInner.appendChild(om);
  }
  setTimeout(()=>inp.focus(),80);
}
function dockChips(opciones, grid){
  marca(()=>dockChips(opciones, grid));
  dockLimpiar();
  const c = document.createElement('div'); c.className='chips'+(grid?' grid2':'');
  opciones.forEach(o=>{
    const b = document.createElement('button');
    b.className='chip'+(o.clase?' '+o.clase:'');
    b.innerHTML = o.t;
    b.addEventListener('click', ev=>{
      if(!tomaDock()) return;              // ya se tocó: este toque no cuenta
      if(o.noBloquea) sueltaDock();        // abre el selector de archivos
      o.fn(ev);
    });
    c.appendChild(b);
  });
  dockInner.appendChild(c);
}

/* ¿Los pagos registrados ya suman la inicial (o los S/ 70 de la afiliación)? */
function pagosCubiertos(){
  const total = (datos.pagos||[]).reduce((a,x)=>a+(parseFloat(x.monto)||0),0);
  const esperado = esVenta() ? (parseFloat(datos.inicial)||0) : 70;
  return esperado > 0 && total >= esperado - 0.01;
}

/* Los pagos ya se detallaron antes: aquí solo se recogen sus constancias */
function preguntaOtraConstancia(){
  const n = (datos.constancias||[]).length;
  const nPagos = (datos.pagos||[]).length;
  const seguirYa = ()=>{ dockLimpiar(); if(editando){ editando=false; irResumen(); } else { avanzar(); } };

  /* El monto ya está cubierto y cada pago tiene su constancia: no queda nada
     que preguntar. Preguntar igual era un toque de más en cada registro. Si
     después aparece otro voucher, se agrega desde «📋 Ver». */
  if(nPagos && n >= nPagos && pagosCubiertos()){
    burbujaBot(n>1 ? 'Listas las <b>'+n+' constancias</b> ✅' : 'Constancia recibida ✅').then(seguirYa);
    return;
  }

  let msg;
  if(nPagos > 1 && n < nPagos){
    msg = 'Van <b>'+n+' de '+nPagos+' constancias</b>. Falta'+((nPagos-n)>1?'n':'')+' <b>'+(nPagos-n)+'</b>.<span class="peque">Registraste '+nPagos+' pagos: sube el comprobante de cada uno.</span>';
  } else if(nPagos > 1){
    msg = 'Ya están las <b>'+n+' constancias</b> de los '+nPagos+' pagos ✅ ¿Agregas alguna más?';
  } else {
    msg = n===1 ? '¿Hay <b>alguna constancia más</b> de este pago?' : 'Van <b>'+n+' constancias</b>. ¿Agregas otra?';
  }
  burbujaBot(msg).then(()=>{
    dockChips([
      {t:'➕ Agregar otra constancia', noBloquea:true,
       fn:()=>{ burbujaUser('➕ Agregar otra constancia'); fotoCtx='voucher'; fileInput.click(); }},
      {t:'✔️ Eso es todo, continuar', clase:'primario', fn:()=>{
        burbujaUser('✔️ Continuar');
        dockLimpiar();
        if(editando){ editando=false; irResumen(); } else { avanzar(); }
      }}
    ]);
  });
}

/* ---------- Dock de ubicación (ubigeo en cascada) ---------- */
function dockUbigeo(target, onDone){
  marca(()=>dockUbigeo(target, onDone));
  target = target || 'casa';
  /* Cada destino escribe en sus propios campos; la entrega se agregó para la
     excepción de entregar en una dirección que no es la casa ni el trabajo. */
  const CAMPOS = {casa:    ['departamento','provincia','distrito'],
                  trabajo: ['trabDepartamento','trabProvincia','trabDistrito'],
                  entrega: ['entregaDepartamento','entregaProvincia','entregaDistrito']};
  const campo = CAMPOS[target] || CAMPOS.casa;
  dockLimpiar();
  const w = document.createElement('div');
  w.innerHTML =
    '<div class="ubi-label">Departamento</div><select id="selDep"></select>'+
    '<div class="ubi-label">Provincia</div><select id="selProv"></select>'+
    '<div class="ubi-label">Distrito</div><select id="selDist"></select>';
  const btn = document.createElement('button');
  btn.className='chip primario'; btn.textContent='Continuar ➜';
  w.appendChild(btn);
  dockInner.appendChild(w);

  const sDep = w.querySelector('#selDep');
  const sProv = w.querySelector('#selProv');
  const sDist = w.querySelector('#selDist');

  Object.keys(UBIGEO).forEach(d=>{
    const o = document.createElement('option'); o.value=d; o.textContent=d; sDep.appendChild(o);
  });
  function llenaProv(){
    sProv.innerHTML='';
    Object.keys(UBIGEO[sDep.value]).forEach(p=>{
      const o = document.createElement('option'); o.value=p; o.textContent=p; sProv.appendChild(o);
    });
  }
  function llenaDist(preselec){
    sDist.innerHTML='<option value="">— Elige el distrito —</option>';
    UBIGEO[sDep.value][sProv.value].forEach(di=>{
      const o = document.createElement('option'); o.value=di; o.textContent=di; sDist.appendChild(o);
    });
    if(preselec) sDist.value = preselec;
  }
  const preDep = datos[campo[0]], preProv = datos[campo[1]], preDist = datos[campo[2]];
  sDep.value = preDep || 'Arequipa';
  llenaProv();
  sProv.value = preProv && UBIGEO[sDep.value][preProv] ? preProv : Object.keys(UBIGEO[sDep.value])[0];
  llenaDist(preDist || '');
  sDep.addEventListener('change',()=>{ llenaProv(); llenaDist(); });
  sProv.addEventListener('change',()=>llenaDist());

  btn.addEventListener('click',()=>{
    if(!sDist.value){
      burbujaBot('Falta elegir el <b>distrito</b> 🙏','error-msg');
      return;
    }
    datos[campo[0]] = sDep.value;
    datos[campo[1]] = sProv.value;
    datos[campo[2]] = sDist.value;
    burbujaUser(sDist.value+', '+sProv.value+', '+sDep.value);
    dockLimpiar();
    if(onDone){ onDone(); return; }
    if(editandoDireccion){
      editandoDireccion=false; editando=true;
      burbujaBot(PASOS.direccion.pregunta()).then(()=>dockTexto(PASOS.direccion));
    } else if(editando){ editando=false; irResumen(); } else { avanzar(); }
  });
}

fileInput.addEventListener('change',()=>{
  const f = fileInput.files[0];
  if(!f) return;
  const esPdf = (f.type||'').includes('pdf') || /\.pdf$/i.test(f.name||'');
  if(esPdf){
    const lector = new FileReader();
    lector.onload = e => {
      const dataUrl = e.target.result;
      if(fotoCtx==='recibo'){ confirmarPdf(dataUrl, f.name, reciboDone, 'reciboFotoDataUrl'); }
      else { confirmarPdf(dataUrl, f.name, null, 'constancia'); }
    };
    lector.readAsDataURL(f);
  } else {
    comprimirImagen(f, dataUrl=>{
      if(fotoCtx==='recibo'){ confirmarFotoRecibo(dataUrl); }
      else { dockFotoConfirmar(dataUrl); }
    });
  }
  fileInput.value='';
});
/* Los PDF no se pueden previsualizar: se confirman por nombre */
function confirmarPdf(dataUrl, nombre, alCerrar, destino){
  dockLimpiar();
  const w = document.createElement('div');
  w.innerHTML = '<div class="foto-preview-wrap"><div style="font-size:34px;text-align:center">📄</div>'+
    '<div class="foto-preview-txt"><b>'+escapa(nombre)+'</b><br>¿Es el archivo correcto?</div></div>';
  const c = document.createElement('div'); c.className='chips';
  const ok = document.createElement('button'); ok.className='chip primario'; ok.textContent='✅ Sí, usar este archivo';
  const no = document.createElement('button'); no.className='chip secund'; no.textContent='🔄 Elegir otro';
  ok.addEventListener('click',()=>{
    if(!tomaDock()) return;
    burbujaUser('📄 '+nombre);
    dockLimpiar();
    if(destino==='constancia'){
      datos.constancias = datos.constancias || [];
      datos.constancias.push(dataUrl);
      datos.constanciaDataUrl = datos.constancias[0];
      preguntaOtraConstancia();
    } else {
      datos.reciboFotoDataUrl = dataUrl;
      fotoCtx='voucher';
      if(alCerrar) alCerrar();
    }
  });
  no.addEventListener('click',()=>fileInput.click());
  c.appendChild(ok); c.appendChild(no);
  w.appendChild(c); dockInner.appendChild(w);
}
/* Toda imagen se normaliza a JPEG: es lo que Rena Ware pide por correo y lo
   que el portal muestra sin problemas. 1600 px deja legible la letra chica de
   un recibo; createImageBitmap respeta la orientación EXIF, así que las fotos
   tomadas de lado dejan de guardarse giradas. */
function comprimirImagen(file, cb){
  const MAX = 1600, CALIDAD = 0.85;
  const pinta = (fuente, w0, h0)=>{
    let w = w0, h = h0;
    if(w>MAX || h>MAX){ const esc = MAX/Math.max(w,h); w=Math.round(w*esc); h=Math.round(h*esc); }
    const cv = document.createElement('canvas');
    cv.width=w; cv.height=h;
    const cx = cv.getContext('2d');
    cx.fillStyle = '#fff'; cx.fillRect(0,0,w,h);   /* PNG con transparencia → fondo blanco */
    cx.drawImage(fuente,0,0,w,h);
    cb(cv.toDataURL('image/jpeg',CALIDAD));
  };
  if(window.createImageBitmap){
    createImageBitmap(file, {imageOrientation:'from-image'})
      .then(bm=>{ pinta(bm, bm.width, bm.height); bm.close && bm.close(); })
      .catch(()=>porLector());
  } else porLector();

  function porLector(){
    const img = new Image();
    const lector = new FileReader();
    lector.onload = e=>{ img.onload = ()=>pinta(img, img.width, img.height); img.src = e.target.result; };
    lector.readAsDataURL(file);
  }
}

const FACTORES = {3:0.3607261, 6:0.1911048, 9:0.1348315, 12:0.1068937, 15:0.0902886, 18:0.0793481};
const REGLAS = {pctInicial:0.10, saldoMinimo:1050, cuotaMinima:150, gastoMensual:20, contadoTotal:500};

const r2 = x => Math.round(x*100)/100;
function precioAsesorDe(p){ return r2(p.p - (p.vc||0) * 0.15 * 1.18); }
function esAutocompra(){ return datos.ventaTipo === 'Autocompra'; }

function cuantosDe(listaId){ return (datos.items||[]).filter(i=>i.lista===listaId).length; }
/* Las listas exentas acompañan a otra promoción: si el pedido es solo de ellas,
   no se aplican el saldo mínimo, la cuota mínima ni el 100% al contado. */
function pedidoExento(){
  const items = datos.items||[];
  if(!items.length) return false;
  return items.every(i=>{ const l = LISTAS.find(x=>x.id===i.lista); return l && l.exenta; });
}
/* Una lista condicionada (upsell) solo aparece si el pedido ya tiene algo de las listas que exige */
function requisitoCumplido(l){
  if(!l.requiere || !l.requiere.length) return true;
  const usadas = new Set((datos.items||[]).map(i=>i.lista));
  return l.requiere.some(id=>usadas.has(id));
}
function listasDisponibles(){
  return LISTAS.filter(l=>{
    if(esCredito() && !l.credito) return false;
    if(esAutocompra() && !l.autocompra) return false;
    if(l.soloTerceros && datos.ventaTipo !== 'Venta a terceros') return false;
    if(!requisitoCumplido(l)) return false;
    if(l.maxItems && cuantosDe(l.id) >= l.maxItems) return false;
    if(datos.items && datos.items.length){
      const usadas = [...new Set(datos.items.map(i=>i.lista))];
      const hayExclusiva = usadas.some(id=>{ const x = LISTAS.find(y=>y.id===id); return x && !x.mezcla; });
      if(hayExclusiva) return usadas.includes(l.id);
      if(!l.mezcla) return false;
    }
    return true;
  });
}
/* Listas condicionadas que acaban de habilitarse y aún no se han ofrecido */
let upsellOfrecidos = [];
function upsellPendiente(){
  return listasDisponibles().find(l=>
    l.requiere && l.requiere.length && !upsellOfrecidos.includes(l.id) && !cuantosDe(l.id));
}
function ofreceUpsell(despues){
  const l = upsellPendiente();
  if(!l){ despues(); return; }
  upsellOfrecidos.push(l.id);
  const pregunta = l.pregunta || ('¿Desea agregar un producto de <b>'+escapa(l.nombre)+'</b>?');
  burbujaBot(pregunta + (l.aviso ? '<span class="peque">'+l.aviso+'</span>' : '')).then(()=>{
    dockChips([
      {t:'✅ Sí, agregar', clase:'primario', fn:()=>{ burbujaUser('✅ Sí, agregar'); buscarEnLista(l, despues, false); }},
      {t:'No, gracias', clase:'secund', fn:()=>{ burbujaUser('No, gracias'); dockLimpiar(); despues(); }}
    ]);
  });
}
function totalesPedido(){
  const items = datos.items || [];
  const cliente = items.reduce((s,i)=>s+i.precio, 0);
  const asesor  = items.reduce((s,i)=>s+i.precioAsesor, 0);
  const total = esAutocompra() ? asesor : cliente;
  return {cliente, asesor, total, iniMin: Math.round(cliente * REGLAS.pctInicial)};
}
function plazosPosibles(inicial){
  const {total} = totalesPedido();
  const saldo = r2(total - inicial);
  return [3,6,9,12,15,18].map(m=>{
    const cuota = Math.round(saldo * FACTORES[m] + REGLAS.gastoMensual);
    let motivo = null;
    if(!pedidoExento()){
      if(saldo < REGLAS.saldoMinimo) motivo = 'El saldo a financiar no llega a '+fmtSoles(REGLAS.saldoMinimo);
      else if(cuota < REGLAS.cuotaMinima) motivo = 'La cuota queda debajo de '+fmtSoles(REGLAS.cuotaMinima);
    }
    return {meses:m, cuota, saldo, valido: !motivo, motivo};
  });
}
/* Mantiene producto y adicionales en texto, para el resumen y el envío */
function sincronizaItems(){
  /* Estos dos son campos de presentación (van al panel y al resumen), así que
     llevan el código delante. El dato estructurado —datos.items— se queda con
     el nombre limpio y su código aparte. */
  const items = datos.items || [];
  datos.producto = items.length ? nombreItem(items[0]) : '';
  datos.adicionales = items.slice(1).map(nombreItem);
}

/* ---------- Elegir lista ---------- */
function pedirProducto(onListo, primero){
  const listas = listasDisponibles();
  if(listas.length === 1){ buscarEnLista(listas[0], onListo, primero); return; }
  burbujaBot('¿De qué <b>lista</b> es el producto?').then(()=>{
    dockChips(listas.map(l=>({t:'📋 '+l.nombre, fn:()=>{ burbujaUser('📋 '+l.nombre); buscarEnLista(l, onListo, primero); }})));
  });
}
/* ---------- Buscador dentro de la lista ---------- */
function buscarEnLista(lista, onListo, primero){
  const intro = (primero ? '¿Qué <b>producto o promoción</b> lleva '+nObj()+'?' : '¿Qué <b>producto</b> agrega?')
    + '<span class="peque">Escribe parte del nombre o el código y elige de la lista.</span>'
    + (lista.aviso ? '<span class="peque">⚠️ '+lista.aviso+'</span>' : '');
  burbujaBot(intro).then(()=>dockBuscador(lista, onListo));
}
function dockBuscador(lista, onListo){
  marca(()=>dockBuscador(lista, onListo));
  dockLimpiar();
  const w = document.createElement('div');
  const inp = document.createElement('input');
  inp.type='text'; inp.className='inp-buscar'; inp.placeholder='Buscar producto…'; inp.autocomplete='off';
  const res = document.createElement('div'); res.className='resultados';
  w.appendChild(inp); w.appendChild(res);
  dockInner.appendChild(w);

  const dePedido = new Set((datos.items||[]).map(i=>i.lista+'|'+i.codigo));
  const base = PRODUCTOS.filter(p=>p.l===lista.id);
  const pinta = ()=>{
    const q = normTxt(inp.value);
    /* Palabras sueltas en cualquier orden: "chef cubiertos" encuentra
       "JUEGO CHEF II + CUBIERTOS", que antes no salía. */
    const pal = normTxt(q||'').split(/\s+/).filter(Boolean);
    const lista2 = base.filter(p=>{
      if(!pal.length) return true;
      const heno = normTxt(p.n)+' '+normTxt(p.g)+' '+String(p.c||'');
      return pal.every(w => heno.includes(w));
    });
    res.innerHTML = '';
    if(!lista2.length){
      res.innerHTML = '<div class="sin-res">Sin resultados. Prueba con otra palabra.</div>';
      return;
    }
    lista2.slice(0,40).forEach(p=>{
      const b = document.createElement('button');
      b.className = 'item-prod' + (dePedido.has(p.l+'|'+p.c) ? ' ya' : '');
      /* El regalo del especial estaba en la base y no se veía en ningún lado:
         es parte de lo que se ofrece, así que va debajo del nombre. */
      b.innerHTML = '<span class="ip-n"><b class="ip-cod">'+escapa(String(p.c||''))+'</b> '+escapa(p.n)+
        (p.r ? '<span class="ip-reg">🎁 '+escapa(p.r)+'</span>' : '')+'</span>'+
        '<span class="ip-m">'+
        '<span class="ip-p">'+fmtSoles(esAutocompra() ? precioAsesorDe(p) : p.p)+'</span></span>';
      b.addEventListener('click', ()=>{
        const it = {lista:p.l, codigo:p.c, nombre:p.n, regalo:p.r||'', precio:p.p,
                    precioAsesor:precioAsesorDe(p), puntos:p.pts||0, cantidad:1};
        datos.items = datos.items || [];
        datos.items.push(it);
        sincronizaItems();
        burbujaUser(nombreConRegalo(it));
        dockLimpiar();
        ofreceUpsell(onListo);
      });
      res.appendChild(b);
    });
  };
  inp.addEventListener('input', pinta);
  pinta();
  setTimeout(()=>inp.focus(), 80);
}
/* ---------- Loop de productos ----------
   Los productos se pueden quitar desde aquí. Retroceder con el botón Atrás ya
   no los borra —eso haría perder todo lo respondido después—, así que quitar
   un producto agregado por error tiene que ser una acción explícita. */
function quitaProducto(i){
  const it = (datos.items||[])[i];
  if(!it) return loopProductos();
  datos.items.splice(i, 1);
  /* sincronizaItems reparte: el primero va en producto y el resto en
     adicionales. Rehacerlo a mano dejaba adicionales desactualizado. */
  sincronizaItems();
  burbujaUser('🗑️ Quitar ' + tituloCorto(nombreItem(it)));
  dockLimpiar();
  if(!datos.items.length){
    burbujaBot('Listo, el pedido quedó <b>sin productos</b>. Elige uno para continuar.')
      .then(()=>pedirProducto(loopProductos, true));
    return;
  }
  loopProductos();
}

/* Nombre corto para el botón: los especiales son larguísimos */
/* El producto se MUESTRA con su código delante —en las listas de especiales
   hay nombres casi idénticos y el código es lo único que los distingue— pero
   se GUARDA con el nombre limpio: el código ya tiene su propio campo.
   Guardarlo también dentro del nombre hizo que el contrato lo imprimiera dos
   veces, «385000 - 385000 Especial #31». Componer al mostrar no puede repetir.
   El startsWith cubre los pocos registros viejos que quedaron con el código
   pegado al nombre. */
function conCodigo(codigo, nombre){
  const c = String(codigo||'').trim(), n = String(nombre||'').trim();
  if(!c) return n;
  if(n.startsWith(c)) return n;
  return c + ' ' + n;
}
/* El nombre que ve el asesor, con código; se usa en el resumen y la pestaña. */
function nombreItem(it){ return conCodigo(it && it.codigo, it && it.nombre); }
/* El regalo NO se mete dentro del nombre: el nombre va tal cual a la base y al
   contrato, y meterlo ahí lo repetiría en todos lados. Se muestra al lado. */
function regaloItem(it){ return (it && it.regalo || '').trim(); }
/* Los especiales de una misma campaña suelen traer el mismo regalo: se
   muestra una vez, no una por producto. */
function regalosDelPedido(){
  const vistos = [];
  (datos.items||[]).forEach(it=>{ const r = regaloItem(it);
    if(r && !vistos.includes(r)) vistos.push(r); });
  return vistos.join(' · ');
}
function nombreConRegalo(it){
  const r = regaloItem(it);
  return nombreItem(it) + (r ? '  🎁 ' + r : '');
}
function tituloCorto(n){
  const s = String(n||'');
  const m = s.match(/^([^·]{3,34})·/);          /* "384700 Especial #22 · ..." */
  return (m ? m[1].trim() : s.slice(0, 34)) + (s.length > 36 && !m ? '…' : '');
}

/* «Agua Setiembre 2026 (foto)» → tipo y mes por separado. Es el texto que el
   formulario guardó en su momento; si no calza con ninguno de los servicios
   conocidos, se usa tal cual y no se pierde nada. */
const SERVICIOS = ['Luz','Agua','Gas','Internet','Cable','Contrato de alquiler'];
function partesRecibo(txt){
  const t = String(txt||'').replace(/\s*\((foto|archivo)\)\s*$/i,'').trim();
  const s = SERVICIOS.find(x => normTxt(t).startsWith(normTxt(x)));
  if(!s) return {tipo:t, mes:''};
  return {tipo:s, mes: t.slice(s.length).replace(/^\s*N°.*$/,'').trim()};
}

/* Rena Ware pide un recibo de menos de tres meses, así que el mes importa
   tanto como el archivo. Se ofrecen los últimos cuatro en hora de Lima para no
   hacer escribir, y queda la salida de "otro mes" para los casos raros. */
const MESES_ES = ['enero','febrero','marzo','abril','mayo','junio','julio',
                  'agosto','setiembre','octubre','noviembre','diciembre'];
function hoyLima(){
  const p = new Intl.DateTimeFormat('en-CA', {timeZone:'America/Lima',
            year:'numeric', month:'2-digit', day:'2-digit'}).format(new Date());
  const [a,m,d] = p.split('-').map(Number);
  return {anio:a, mes:m, dia:d};
}
function etiquetaMes(anio, mes){
  return MESES_ES[mes-1].charAt(0).toUpperCase()+MESES_ES[mes-1].slice(1)+' '+anio;
}
function pideMesRecibo(luego){
  const h = hoyLima();
  const ops = [];
  for(let k=0; k<4; k++){
    let m = h.mes - k, a = h.anio;
    while(m <= 0){ m += 12; a -= 1; }
    const etq = etiquetaMes(a, m), clave = a+'-'+String(m).padStart(2,'0');
    ops.push({t:(k===0?'🗓️ ':'')+etq, clase:(k===0?'primario':''), fn:()=>{
      datos.reciboMes = clave; datos.reciboMesTexto = etq;
      burbujaUser(etq); dockLimpiar(); luego();
    }});
  }
  ops.push({t:'✍️ Otro mes', clase:'secund ancho', fn:()=>{
    burbujaUser('✍️ Otro mes'); dockLimpiar();
    burbujaBot('Escribe el <b>mes y el año</b> del recibo.<span class="peque">Por ejemplo: 07/2026 o julio 2026</span>').then(()=>{
      dockTexto({tipo:'texto', inputmode:'text', placeholder:'MM/AAAA',
        valida(v){
          const t = String(v||'').trim().toLowerCase();
          let m = null, a = null;
          const num = t.match(/^(\d{1,2})\s*[\/\-\. ]\s*(\d{4})$/);
          if(num){ m = +num[1]; a = +num[2]; }
          else {
            const nom = t.match(/^([a-záéíóúñ]+)\s+(\d{4})$/);
            if(nom){
              const i = MESES_ES.findIndex(x=>x.startsWith(nom[1].slice(0,4)
                        .replace('sept','seti')));
              if(i >= 0){ m = i+1; a = +nom[2]; }
            }
          }
          if(!m || m < 1 || m > 12 || !a || a < 2020 || a > hoyLima().anio+1)
            return {ok:false, msg:'No entendí el mes. Escríbelo como <b>07/2026</b> o <b>julio 2026</b> 🙏'};
          return {ok:true, v: a+'-'+String(m).padStart(2,'0')};
        },
        guarda(v){
          const [a,m] = v.split('-').map(Number);
          datos.reciboMes = v; datos.reciboMesTexto = etiquetaMes(a,m);
        }}, luego);
    });
  }});
  burbujaBot('¿De qué <b>mes es el recibo</b> de '+escapa(datos.reciboTipo.toLowerCase())+'? 🗓️'+
    '<span class="peque">Rena Ware lo pide con menos de tres meses.</span>')
    .then(()=>dockChips(ops, true));
}
function pedirReciboDato(){
  datos.reciboContrato=''; datos.reciboFotoDataUrl='';
  /* Si venía uno reusado y ahora sube otro, el viejo se suelta */
  if(datos.reciboReusado){
    datos.docsReusados = (datos.docsReusados||[]).filter(x=>x.ruta !== datos.reciboReusado.ruta);
    datos.reciboReusado = null;
  }
  if(datos.reciboTipo==='Contrato de alquiler'){
    datos.reciboMes=''; datos.reciboMesTexto='';

    return;

  pideMesRecibo(pedirArchivoRecibo);
}

  if(fuente==='Dependiente') return ['Boletas de pago (últimos 2 meses)','Estado de cuenta (banco o tarjeta)','Otro documento'];

  return ['Constancia de abono de la pensión','Estado de cuenta (banco o tarjeta)','Otro documento'];

/* El nombre del archivo lleva dentro qué documento es: «sustento-1-1-boleta-
   de-pago.jpg». Los más viejos guardaron el nombre original del celular, y
   esos se muestran tal cual. */
function etiquetaSustento(nombre){
  const m = String(nombre||'').match(/^sustento-\d+-\d+-(.+)\.[a-z0-9]+$/i);
  const t = m ? m[1] : String(nombre||'Documento');
  if(/\s/.test(t)) return t;
  const s = t.replace(/-/g,' ').trim();
  return s.charAt(0).toUpperCase()+s.slice(1);
}

        '<span>'+escapa(s.name)+' <span style="color:#5a6b7a;font-size:13px">('+escapa(s.tipo)+')</span></span></div>';
    });
    list += '</div>';
    w.innerHTML = list;
  }
  const c = document.createElement('div'); c.className='chips grid2';
  tiposSustento(sustentoCtx.fuente).forEach(t=>{
    const b = document.createElement('button'); b.className='chip'; b.textContent='📎 '+t;

  });
  /* Los sustentos que ya subió en otra compra sirven igual, y están a un
     toque en vez de a una búsqueda en la galería. */
  docsPrevios('sustento')
    .filter(d=>!(sustentoCtx.sustentos||[]).some(s=>s.ruta===d.ruta))
    .slice(0,4).forEach(d=>{
      const b = document.createElement('button'); b.className='chip secund';
      b.innerHTML = '♻️ '+escapa(etiquetaSustento(d.nombre))+
                    '<span class="peque">ya subido el '+escapa(d.subido)+'</span>';
      b.addEventListener('click',()=>{
        sustentoCtx.sustentos.push({name:etiquetaSustento(d.nombre),
                                    tipo:'De una compra anterior', ruta:d.ruta});
        reusaDoc(d);
        burbujaUser('♻️ '+etiquetaSustento(d.nombre));
        renderSustentosDock();
      });
      c.appendChild(b);
    });

  if(sustentoCtx.sustentos.length){
    const b2 = document.createElement('button'); b2.className='chip primario'; b2.textContent='✔️ Listo con los sustentos';
    b2.addEventListener('click',()=>{
      burbujaUser('✔️ Listo: '+sustentoCtx.sustentos.length+' sustento(s)');
      dockLimpiar();
      sustentoCtx.alCerrarSustentos();
    });
    c.appendChild(b2);
  } else {
    const b3 = document.createElement('button'); b3.className='chip secund'; b3.textContent='⏭️ Omitir por ahora';
    b3.addEventListener('click',()=>{
      burbujaUser('⏭️ Omitir');
      burbujaBot('No recomendado ⚠️ Sin sustentos es <b>menos probable que aprueben el crédito</b>. ¿Seguro que deseas omitir?').then(()=>{
        dockChips([
          {t:'📎 Mejor subo algo', clase:'primario', fn:()=>{ burbujaUser('📎 Mejor subo algo'); renderSustentosDock(); }},
          {t:'⏭️ Omitir de todos modos', clase:'secund', fn:()=>{ burbujaUser('Omitir de todos modos'); dockLimpiar(); sustentoCtx.alCerrarSustentos(); }}
        ]);
      });
    });
    c.appendChild(b3);
  }
  w.appendChild(c); dockInner.appendChild(w);
}
sustentoInput.addEventListener('change', ()=>{
  const files = [...sustentoInput.files];
  sustentoInput.value='';
  if(!files.length || !sustentoCtx) return;
  const tipoS = sustentoTipoActual || 'Documento';
  let pend = files.length;
  files.forEach(fl=>{
    if(fl.type && fl.type.startsWith('image/')){
      comprimirImagen(fl, du=>{ sustentoCtx.sustentos.push({name:fl.name, tipo:tipoS, thumb:du}); if(--pend===0) renderSustentosDock(); });
    } else {
      sustentoCtx.sustentos.push({name:fl.name, tipo:tipoS});
      if(--pend===0) renderSustentosDock();
    }
  });
});
let trabBackup = null;
function guardaTrab(){ trabBackup = {d:datos.trabDepartamento, p:datos.trabProvincia, di:datos.trabDistrito, dir:datos.trabDireccion, mc:datos.trabajoMismaCasa}; }
function restauraTrab(){
  if(!trabBackup) return;
  datos.trabDepartamento=trabBackup.d; datos.trabProvincia=trabBackup.p;
  datos.trabDistrito=trabBackup.di; datos.trabDireccion=trabBackup.dir;
  datos.trabajoMismaCasa=trabBackup.mc;
  trabBackup=null;
}
function flujoLaborales(persona, alFinal, fuentePreset){
  const nombreP = ()=> persona==='Cónyuge' ? '<b>'+escapa(primerNombre((datos.conyuge||{}).nombre||'el cónyuge'))+'</b>' : nObj();
  const esPrimera = !datos.fuentes.some(x=>x.titular===persona);
  const f = {titular:persona, fuente:'', dedicacion:'', cargo:'', empresa:'', ruc:'', tiempo:'', tiempoMeses:0, sueldo:null, sustentos:[]};

  /* --- 0. ¿Ya conocemos su trabajo de una compra anterior? ---
     Se ofrece completo (fuente, giro, cargo, empresa, tiempo e ingreso) porque
     en un crédito este bloque es el más largo de todo el formulario. */
  const pideConocida = ()=>{
    if(persona!=='Titular') return false;
    const usadas = (datos.fuentes||[]).map(x=>normTxt((x.dedicacion||'')+'|'+(x.empresa||'')));
    const cand = opcionesDe('fuentes').filter(it=>
      !usadas.includes(normTxt((it.dedicacion||'')+'|'+(it.empresa||''))));
    if(!cand.length) return false;
    const rotulo = it=>{
      const emp = (it.empresa && it.empresa.toLowerCase()!=='sin nombre') ? it.empresa : '';
      return [it.fuente, it.dedicacion].filter(Boolean).join(' · ') +
        '<span class="peque">' +
        [emp, it.cargo, it.tiempo, (it.sueldo? fmtSoles(it.sueldo):'')].filter(Boolean).join(' · ') +
        ' · última el ' + it.ultima + '</span>';
    };
    const ops = cand.slice(0,4).map((it,i)=>({
      t:(i===0?'🕒 ':'')+'💼 '+rotulo(it),
      fn:()=>{
        burbujaUser('💼 '+[it.fuente,it.dedicacion].filter(Boolean).join(' · ')); dockLimpiar();
        Object.assign(f, {
          fuente:it.fuente||'', dedicacion:it.dedicacion||'', cargo:it.cargo||'',
          empresa:it.empresa||'', ruc:it.ruc||'', tiempo:it.tiempo||'',
          sueldo:(it.sueldo!=null? parseFloat(it.sueldo): null)
        });
        if(it.trab_direccion)    datos.trabDireccion    = it.trab_direccion;
        if(it.trab_departamento) datos.trabDepartamento = it.trab_departamento;
        if(it.trab_provincia)    datos.trabProvincia    = it.trab_provincia;
        if(it.trab_distrito)     datos.trabDistrito     = it.trab_distrito;
        burbujaBot('Listo 👍 Si algo cambió —el sueldo, el cargo— lo corriges al final en el resumen.')
          .then(()=>pideSustentos());
      }
    }));
    ops.push({t:'✍️ Es otro trabajo', clase:'secund',
              fn:()=>{ burbujaUser('✍️ Es otro trabajo'); dockLimpiar(); pideFuente(); }});
    burbujaBot('¿'+(esPrimera?'Sigue en el mismo trabajo':'Es otra fuente que ya conocemos')+
      '? 💼<span class="peque">Tomado de sus compras anteriores.</span>')
      .then(()=>dockChips(ops, true));
    return true;
  };

  /* --- 1. Fuente de ingreso --- */
  const pideFuente = ()=>{
    burbujaBot('¿Cuál es la <b>fuente de ingreso'+(esPrimera?' principal':'')+'</b> de '+nombreP()+'?').then(()=>{
      const set = (v)=>{ f.fuente=v; burbujaUser(v); pideDedicacion(); };
      const ops = [
        {t:'🛠️ Independiente (cuenta propia)', fn:()=>set('Independiente')},
        {t:'🏢 Dependiente (labora en empresa)', fn:()=>set('Dependiente')},
        {t:'🏠 Alquila propiedades', fn:()=>set('Alquila propiedades')},
        {t:'👴 Pensión de jubilación', fn:()=>set('Pensión de jubilación')}
      ];
      if(persona==='Titular' && esPrimera) ops.push({t:'🚫 No genera ingresos', clase:'secund ancho', fn:()=>{ burbujaUser('🚫 No genera ingresos'); sinIngresos(); }});
      dockChips(ops);
    });
  };
  const sinIngresos = ()=>{
    burbujaBot('Para el crédito es <b>importante sustentar un ingreso</b> 🙏 Si el titular no genera ingresos, el <b>cónyuge puede sustentarlos</b>: en ese caso sus datos y su fuente de ingreso pasan a ser obligatorios.').then(()=>{
      dockChips([
        {t:'↩️ Volver a escoger fuente de ingreso', fn:()=>{ burbujaUser('↩️ Volver a escoger'); pideFuente(); }},
        {t:'💍 El cónyuge sustentará el ingreso', clase:'primario', fn:()=>{
          burbujaUser('💍 El cónyuge sustentará el ingreso');
          datos.sinIngresoTitular = true;
          dockLimpiar();
          alFinal();
        }}
      ]);
    });
  };

  /* --- 2. A qué se dedica (según la fuente) --- */
  const pideDedicacion = ()=>{
    if(f.fuente==='Alquila propiedades'){
      burbujaBot('¿Qué <b>alquila</b> '+nombreP()+'?').then(()=>{
        const set = (v)=>{ f.dedicacion=v; burbujaUser(v); pideDirTrabajo(); };
        dockChips([
          {t:'🚪 Habitaciones', fn:()=>set('Alquila habitaciones')},
          {t:'🏡 Vivienda', fn:()=>set('Alquila vivienda')},
          {t:'🏪 Local para negocio', fn:()=>set('Alquila local para negocio')}
        ]);
      });
      return;
    }
    if(f.fuente==='Pensión de jubilación'){
      burbujaBot('¿En qué <b>profesión u ocupación se jubiló</b>?<span class="peque">Ejemplo: docente, obrero de construcción, enfermera.</span>').then(()=>{
        dockTexto({tipo:'texto',inputmode:'text',placeholder:'Ej.: docente',
          valida(v){ const l=v.trim().replace(/\s+/g,' '); if(l.length<4) return {ok:false,msg:'Escribe la profesión u ocupación, por favor 🙏'}; return {ok:true,v:l}; },
          guarda(v){ f.dedicacion=v; }}, pideEmpresa);
      });
      return;
    }
    /* En independiente este campo va al portal como EMPRESA O NEGOCIO cuando el
       negocio no tiene nombre, así que se pregunta el GIRO, no el puesto. El
       puesto se pide aparte, en la pregunta de cargo. En dependiente la empresa
       sí tiene nombre, de modo que aquí se pregunta la ocupación. */
    const esIndep = f.fuente==='Independiente';
    const enc = esIndep
      ? '¿Cuál es el <b>giro del negocio</b> de '+nombreP()+'?'+
        '<span class="peque">El rubro, no el puesto. Ejemplos: bodega, restaurante, '+
        'construcción civil, venta de ropa, alquiler de camionetas.<br>'+
        'Su cargo dentro del negocio te lo pregunto después.</span>'
      : '¿A qué se dedica exactamente '+nombreP()+'?'+
        '<span class="peque">Ejemplo: docente de colegio, enfermera, policía.</span>';
    burbujaBot(enc).then(()=>{
      dockTexto({tipo:'texto',inputmode:'text',
        placeholder: esIndep?'Ej.: bodega, construcción civil':'Ej.: docente de colegio',
        valida(v){
          const l=v.trim().replace(/\s+/g,' ');
          if(l.length<4) return {ok:false, msg: esIndep
            ? '¿A qué rubro se dedica el negocio? Ejemplo: bodega, restaurante 🙏'
            : 'Cuéntame un poco más: ¿a qué se dedica exactamente? 🙏'};
          return {ok:true,v:l};
        },
        guarda(v){ f.dedicacion=v; }}, pideEmpresa);
    });
  };

  /* --- 3. Empresa / negocio / institución --- */
  const pideEmpresa = ()=>{
    if(f.fuente==='Independiente'){
      burbujaBot('¿Su negocio tiene <b>nombre</b>?').then(()=>{
        dockChips([
          {t:'✍️ Sí, escribir el nombre', fn:()=>{
            burbujaUser('Sí, tiene nombre');
            burbujaBot('Escribe el <b>nombre del negocio</b>.').then(()=>{
              dockTexto({tipo:'texto',inputmode:'text',placeholder:'Nombre del negocio',
                valida(v){ const l=v.trim(); if(l.length<2) return {ok:false,msg:'Escribe el nombre del negocio, por favor 🙏'}; return {ok:true,v:l}; },
                guarda(v){ f.empresa=v; }}, pideRuc);
            });
          }},
          /* Sin nombre no es un vacío: en Rena Ware se escribe el giro en ese campo,
             y eso ya lo tenemos en f.dedicacion. */
          {t:'No tiene nombre', clase:'secund', fn:()=>{
            burbujaUser('No tiene nombre'); f.empresa='Sin nombre'; dockLimpiar();
            burbujaBot('Perfecto. En Rena Ware ese campo llevará el giro: <b>'+escapa(f.dedicacion||'')+'</b>.').then(pideRuc);
          }}
        ]);
      });
      return;
    }
    if(f.fuente==='Pensión de jubilación'){
      burbujaBot('¿En qué <b>institución se jubiló</b>?<span class="peque">Ejemplo: Ministerio de Educación, Policía Nacional, Essalud, empresa privada.</span>').then(()=>{
        dockTexto({tipo:'texto',inputmode:'text',placeholder:'Institución donde se jubiló',
          valida(v){ const l=v.trim().replace(/\s+/g,' '); if(l.length<3) return {ok:false,msg:'Escribe la institución completa, por favor 🙏'}; return {ok:true,v:l}; },
          guarda(v){ f.institucion=v; }}, pideDirInstit);
      });
      return;
    }
    burbujaBot('Escribe el <b>nombre completo de la empresa</b> donde trabaja.<span class="peque">Si trabaja en un ministerio, la policía o una institución similar, indica la <b>sede</b> en la que trabaja.</span>').then(()=>{
      dockTexto({tipo:'texto',inputmode:'text',placeholder:'Empresa o sede donde trabaja',
        valida(v){ const l=v.trim().replace(/\s+/g,' '); if(l.length<2) return {ok:false,msg:'Escríbelo completo, por favor 🙏'}; return {ok:true,v:l}; },
        guarda(v){ f.empresa=v; }}, pideRuc);
    });
  };

  const pideDirInstit = ()=>{
    guardaTrab();
    burbujaBot('¿Dónde queda <b>'+escapa(f.institucion)+'</b>? Elige el departamento, provincia y distrito 👇').then(()=>{
      dockUbigeo('trabajo', ()=>{
        burbujaBot('Y la <b>dirección exacta</b> de la institución en '+escapa(datos.trabDistrito)+': calle, número…').then(()=>{
          dockTexto({tipo:'textarea',placeholder:'Calle/Av., número, referencia',
            valida(v){ return validaCalle(v, 'la dirección de la institución'); },
            guarda(v){ f.direccionInst = datos.trabDistrito+' — '+v; }}, ()=>{ restauraTrab(); pidePension(); });
        });
      });
    });
  };
  const pidePension = ()=>{
    burbujaBot('¿De dónde <b>recibe su pensión</b>? (ONP, AFP, etc.)').then(()=>{
      dockTexto({tipo:'texto',inputmode:'text',placeholder:'ONP, AFP…',
        valida(v){ const l=v.trim().replace(/\s+/g,' '); if(l.length<2) return {ok:false,msg:'Escríbelo completo, por favor 🙏'}; return {ok:true,v:l}; },
        guarda(v){ f.empresa=v; }}, pideDirTrabajo);
    });
  };

  /* --- 4. RUC (según la fuente; jubilación no lleva) --- */
  const pideRuc = (siguiente)=>{
    const sig = siguiente || pideDirTrabajo;
    let q, ph, om;
    if(f.fuente==='Dependiente'){ q='¿Cuál es el <b>RUC de la empresa</b> donde trabaja?'; ph='11 dígitos'; om='⏭️ No lo tengo a la mano'; }
    else if(f.fuente==='Independiente'){ q='¿'+nombreP()+' tiene <b>RUC</b>? Si lo tiene, escríbelo.'; ph='11 dígitos'; om='⏭️ No tiene RUC'; }
    else { q='¿'+nombreP()+' tiene <b>RUC</b> propio? Si lo tiene, escríbelo.'; ph='11 dígitos'; om='⏭️ No tiene RUC'; }
    burbujaBot(q).then(()=>{
      dockTexto({tipo:'texto',inputmode:'numeric',placeholder:ph,
        valida(v){ const l=v.replace(/\D/g,''); if(!/^(10|15|17|20)\d{9}$/.test(l)) return {ok:false,msg:'El RUC debe tener <b>11 números</b>. Revísalo o usa el botón para saltarlo 🙏'}; return {ok:true,v:l}; },
        guarda(v){ f.ruc=v; },
        omitirTxt:om, omitir:()=>sig()}, sig);
    });
  };

  /* --- 5. Dirección de trabajo (solo en la primera fuente) --- */
  const pideDirTrabajo = ()=>{
    if(f.fuente==='Alquila propiedades'){
      guardaTrab();
      burbujaBot('¿Dónde queda la <b>propiedad en alquiler</b>? Elige el departamento, provincia y distrito 👇').then(()=>{
        dockUbigeo('trabajo', pideCalleTrab);
      });
      return;
    }
    // La dirección de trabajo que se registra es la del titular (define zona y entrega)
    if(persona!=='Titular' || !esPrimera){ pideTiempo(); return; }
    if(f.fuente==='Pensión de jubilación'){
      if(esPrimera){
        datos.trabajoMismaCasa=true;
        datos.trabDepartamento=datos.departamento; datos.trabProvincia=datos.provincia;
        datos.trabDistrito=datos.distrito; datos.trabDireccion=datos.direccion;
      }
      pideTiempo(); return;
    }
    burbujaBot('¿Cuál es la <b>dirección de trabajo</b> de '+nombreP()+'?').then(()=>{
      dockChips([
        {t:'📍 Ingresar dirección de trabajo', fn:()=>{
          burbujaUser('📍 Ingresar dirección de trabajo');
          burbujaBot('¿Dónde queda el trabajo? Elige el departamento, provincia y distrito 👇').then(()=>dockUbigeo('trabajo', pideCalleTrab));
        }},
        {t:'🚫 No tiene dirección de trabajo', clase:'secund', fn:()=>{
          burbujaUser('🚫 No tiene dirección de trabajo');
          burbujaBot('¿Seguro? Si tiene <b>tienda, oficina o dirección de trabajo</b>, es mejor colocarla 😉').then(()=>{
            dockChips([
              {t:'📍 Mejor ingreso la dirección', clase:'primario', fn:()=>{
                burbujaUser('Mejor ingreso la dirección');
                burbujaBot('¿Dónde queda el trabajo? Elige el departamento, provincia y distrito 👇').then(()=>dockUbigeo('trabajo', pideCalleTrab));
              }},
              {t:'✔️ Confirmo que no tiene', fn:()=>{
                burbujaUser('Confirmo que no tiene');
                datos.trabajoMismaCasa=true;
                datos.trabDepartamento=datos.departamento; datos.trabProvincia=datos.provincia;
                datos.trabDistrito=datos.distrito; datos.trabDireccion=datos.direccion;
                dockLimpiar();
                pideTiempo();
              }}
            ]);
          });
        }}
      ]);
    });
  };
  const pideCalleTrab = ()=>{
    const esAlq = f.fuente==='Alquila propiedades';
    if(!esAlq) datos.trabajoMismaCasa=false;
    const pista = f.fuente==='Independiente'
      ? '<span class="peque">Si es un <b>mercado o centro comercial</b>, asegúrate de incluir también el <b>número de puesto o local</b>.</span>'
      : f.fuente==='Dependiente'
        ? '<span class="peque">Si trabaja en una <b>institución pública</b>, asegúrate de dar la dirección de la <b>sede donde labora</b>, no la principal.</span>'
        : '';
    burbujaBot('Y la <b>dirección exacta</b> '+(esAlq?'de la propiedad en alquiler':'del trabajo')+' en '+escapa(datos.trabDistrito)+': calle, número, Mz, Lt…'+pista).then(()=>{
      dockTexto({tipo:'textarea',placeholder:'Solo la dirección: Av. Bolognesi 820, puesto 218',
        maxlength:50,
        valida(v){ return validaCalle(v, esAlq?'la dirección de la propiedad':'la dirección de trabajo'); },
        guarda(v){ if(esAlq){ f.direccionProp = datos.trabDistrito+' — '+v; } else { datos.trabDireccion=v; } }}, ()=>{
          if(esAlq){ restauraTrab(); pideRuc(pideTiempo); return; }
          if(persona==='Titular' && !esZonaCreditoTrabajo()){
            burbujaBot('⚠️ La dirección de trabajo está <b>fuera de zona de crédito</b>. Quien trabaja en zona de crédito, lo más probable es que también viva allí: a veces conviene que el crédito vaya a nombre de la esposa(o) o de un familiar que <b>viva y trabaje en zona de crédito</b>. Puedes continuar si lo deseas.<span class="peque">Ten en cuenta: la entrega siempre debe ser en zona de crédito, así que solo podrá ser en la casa.</span>').then(()=>{
              dockChips([
                {t:'➡️ Continuar así', clase:'primario', fn:()=>{ burbujaUser('➡️ Continuar así'); dockLimpiar(); pideTiempo(); }},
                {t:'✏️ Corregir dirección de trabajo', fn:()=>{
                  burbujaUser('✏️ Corregir dirección de trabajo');
                  burbujaBot('¿Dónde queda el trabajo? Elige el departamento, provincia y distrito 👇').then(()=>dockUbigeo('trabajo', pideCalleTrab));
                }}
              ]);
            });
          } else { pideTiempo(); }
        });
    });
  };

  /* --- 6. Tiempo --- */
  const pideTiempo = ()=>{
    if(f.fuente==='Pensión de jubilación'){ f.tiempo='Pensión vigente'; pideSustentos(); return; }
    const q = (f.fuente==='Alquila propiedades' ? '¿Hace <b>cuánto tiempo</b> alquila esta propiedad?'
            : '¿Hace <b>cuánto labora</b> en ello?')
            + '<span class="peque">Escribe el número y la unidad. Ejemplos: 8 meses · 3 años · 30 años.</span>';
    const sigue = (texto, meses)=>{
      f.tiempo = texto; f.tiempoMeses = meses;
      if(meses < 3){
        burbujaBot('Ojo 👀 Con <b>menos de 3 meses</b> en la actividad actual, Rena Ware suele pedir un <b>garante</b>. Coordínalo con tu asesor 🙌').then(()=>{
          dockChips([{t:'✅ Entendido', clase:'primario', fn:()=>{ burbujaUser('✅ Entendido'); dockLimpiar(); pideSustentos(); }}]);
        });
      } else { dockLimpiar(); pideSustentos(); }
    };
    burbujaBot(q).then(()=>{
      dockTexto({tipo:'texto', inputmode:'text', placeholder:'Ej.: 8 meses  ·  3 años',
        valida(v){
          const m = String(v).trim().toLowerCase().replace(/\./g,'')
            .match(/^(\d{1,3})\s*(años|anos|año|ano|añ|an|a|meses|mese|mes|me|m)$/);
          if(!m) return {ok:false, msg:'Escribe el <b>número y la unidad</b>: por ejemplo <b>8 meses</b> o <b>3 años</b> 🙏'};
          const n = parseInt(m[1],10), esA = m[2][0]==='a';
          if(n<1 || (esA && n>70) || (!esA && n>840)) return {ok:false, msg:'Ese número no parece correcto. Revísalo, por favor 🙏'};
          const meses = esA ? n*12 : n;
          const texto = n + (esA ? (n===1?' año':' años') : (n===1?' mes':' meses'));
          /* Se guardan aquí, igual que los meses: no depender del orden en que
             dockTexto llame a guarda() y al callback. Ese desfase dejaba
             f.tiempo vacío mientras f.tiempoMeses sí se llenaba. */
          f._m = meses; f._t = texto;
          return {ok:true, v: texto};
        },
        guarda(v){ f.tiempo = v; }}, ()=>sigue(f._t || f.tiempo || tiempoCortoRw(f._m), f._m));
    });
  };

  /* --- 7. Sustentos --- */
  const pideSustentos = ()=>{
    sustentoCtx = f;
    const extra = f.fuente==='Alquila propiedades'
      ? '<span class="peque">Importante: la constancia de tributo sí debe estar a su nombre.</span>' : '';
    burbujaBot('Sustentos de ingreso de '+nombreP()+' 📎 <b>Agrega uno o más sustentos</b>: elige el documento que subirá.'+extra+'<span class="peque">Mientras más sustentos, mejor. Documentos con menos de 3 meses <b>a nombre de '+
      escapa(persona==='Cónyuge' ? ((datos.conyuge||{}).nombre||'el cónyuge') : (datos.ventaComprador||'el titular'))+
      '</b>.</span>').then(()=>renderSustentosDock());
  };

  /* --- 7 bis. Cargo y sueldo (van al portal de Rena Ware) --- */
  const pideCargoSueldo = (luego)=>{
    const esAlq = f.fuente==='Alquila propiedades';
    const pideSueldo = ()=>{
      burbujaBot(esAlq
        ? '¿De cuánto es el <b>alquiler mensual</b> de esta propiedad? 💵<span class="peque">En soles. Es el ingreso que Rena Ware evalúa.</span>'
        : '¿Cuál es el <b>ingreso mensual aproximado</b> de '+nombreP()+'? 💵<span class="peque">En soles. Es el dato que pide Rena Ware para evaluar el crédito.</span>').then(()=>{
        dockTexto({tipo:'texto', inputmode:'decimal', placeholder:'Ej.: 2500',
          valida(v){
            const n = parseFloat(String(v).replace(/[^\d.]/g,''));
            if(!n || n<=0) return {ok:false, msg:'Escribe el ingreso mensual en soles 🙏'};
            return {ok:true, v:n.toFixed(2)};
          },
          guarda(v){ f.sueldo=parseFloat(v); }}, luego);
      });
    };
    /* Un alquiler no tiene cargo, pero sí monto: antes se saltaban los dos y
       la fuente entraba sin ingreso, que es justo lo que se evalúa. */
    if(esAlq){ pideSueldo(); return; }
    burbujaBot('¿Qué <b>cargo u ocupación</b> tiene '+nombreP()+' ahí? 💼<span class="peque">Máximo 16 caracteres: es el espacio que da Rena Ware. '+
      'Ejemplos: COMERCIANTE, PROFESORA, CONSTRUC. CIVIL.<br>'+
      'Si el negocio no tiene nombre, en Rena Ware va el giro («'+escapa(f.dedicacion||'a qué se dedica')+'»); '+
      'aquí va el puesto.</span>').then(()=>{
      dockTexto({tipo:'texto', inputmode:'text', placeholder:'Ej.: COMERCIANTE', maxlength:16,
        omitirTxt:'⏭️ Sin cargo',
        omitir:()=>{ f.cargo=''; burbujaUser('⏭️ Sin cargo'); dockLimpiar(); pideSueldo(); },
        valida(v){
          const t=String(v).trim().toUpperCase();
          if(t.length>16) return {ok:false, msg:'Máximo <b>16 caracteres</b>. Rena Ware no acepta más 🙏'};
          return {ok:true, v:t};
        },
        guarda(v){ f.cargo=v; }}, pideSueldo);
    });
  };

  /* --- 8. Cierre y loop --- */
  const cerrarFuente = ()=>{
    /* Red de seguridad: nunca cerrar una fuente con el tiempo vacío si se sabe cuántos meses son */
    if(!f.tiempo && f.tiempoMeses) f.tiempo = tiempoCortoRw(f.tiempoMeses);
    datos.fuentes.push(f);
    const esAlq = f.fuente==='Alquila propiedades';
    burbujaBot(esAlq
      ? '¿Desea agregar <b>otra propiedad en alquiler</b> u <b>otra fuente de ingreso</b> de '+nombreP()+'?'
      : '¿Desea <b>agregar otra fuente de ingreso</b> de '+nombreP()+'?').then(()=>{
      const ops = [];
      if(esAlq) ops.push({t:'🏠 Otra propiedad en alquiler', fn:()=>{ burbujaUser('🏠 Otra propiedad en alquiler'); flujoLaborales(persona, alFinal, 'Alquila propiedades'); }});
      ops.push({t:'➕ '+(esAlq?'Otra fuente de ingreso':'Sí, agregar otra'), fn:()=>{ burbujaUser('➕ Otra fuente de ingreso'); flujoLaborales(persona, alFinal); }});
      ops.push({t:'✔️ No, continuar', clase:'primario', fn:()=>{ burbujaUser('No, continuar'); dockLimpiar(); alFinal(); }});

      dockChips(ops, esAlq);
    });
  };
  f.alCerrarSustentos = ()=> {
    /* Si el trabajo se tomó de una compra anterior ya trae cargo e ingreso:
       no se vuelven a pedir, se corrigen desde el resumen si cambiaron. */
    if(f.cargo && f.sueldo != null) cerrarFuente();
    else pideCargoSueldo(cerrarFuente);
  };


  if(fuentePreset){ f.fuente = fuentePreset; burbujaBot('Otra <b>propiedad en alquiler</b> 🏠').then(()=>pideDedicacion()); }
  else if(!pideConocida()){ pideFuente(); }
}

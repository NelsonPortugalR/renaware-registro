/* --- Referencias personales --- */
function flujoReferencias(reiniciar){
  if(reiniciar) datos.referencias = [];
  datos.referencias = (datos.referencias||[]).filter(r=>r.nombre && r.celular);
  if(datos.referencias.length>=2){ terminarBloque(); return; }
  pideReferencia(datos.referencias.length+1);
}
function pideReferencia(n, saltaConocidas){
  const r = {nombre:'', celular:'', direccion:'', rol: n===1 ? 'familiar' : 'referencia'};
  const esFam = (n===1);

  /* Si el cliente ya dio referencias en compras anteriores, se ofrecen las que
     encajan en este turno (familiar o personal) en vez de volver a escribirlas.
     Se excluyen las ya usadas en esta venta. */
  if(!saltaConocidas){
    const rolBuscado = esFam ? 'familiar' : 'referencia';
    const usadas = (datos.referencias||[]).map(x=>normTxt(x.nombre));
    const cand = opcionesDe('referencias').filter(it=>{
      if(!it.nombre || !it.celular) return false;
      if(usadas.includes(normTxt(it.nombre))) return false;
      /* Las de rol desconocido sirven para cualquiera de los dos huecos */
      return !it.rol || it.rol === rolBuscado;
    });
    if(cand.length){
      const ops = cand.slice(0,5).map((it,i)=>({
        t:(i===0?'🕒 ':'')+'👤 '+escapa(it.nombre)+'<span class="peque">'+escapa(it.celular)+
          (it.direccion?' · '+escapa(String(it.direccion).slice(0,32)):'')+
          ' · usada '+(it.veces>1?it.veces+' veces · ':'')+'última el '+it.ultima+'</span>',
        fn:()=>{
          burbujaUser('👤 '+it.nombre); dockLimpiar();
          datos.referencias.push({nombre:it.nombre, celular:it.celular,
                                  direccion:it.direccion||'', rol:rolBuscado});
          flujoReferencias();
        }
      }));
      ops.push({t:'✍️ Otra persona', clase:'secund',
                fn:()=>{ burbujaUser('✍️ Otra persona'); dockLimpiar(); pideReferencia(n, true); }});
      burbujaBot((esFam?'<b>Familiar</b> de contacto 👨‍👩‍👧':'<b>Referencia personal</b> 👥')+
        ' ¿Usamos a alguien que ya dio antes?').then(()=>dockChips(ops, true));
      return;
    }
  }
  const enc = esFam
    ? '<b>Familiar</b> de contacto 👨‍👩‍👧 Escribe su <b>nombre y los dos apellidos</b>.<span class="peque">Rena Ware pide un familiar del cliente: padre, madre, hijo, hermano o similar. No puede ser el cónyuge ni el propio cliente.</span>'
    : '<b>Referencia personal</b> 👥 Escribe su <b>nombre y los dos apellidos</b>.<span class="peque">No puede ser el cónyuge, el asesor, el cliente ni un familiar directo (padres, hijos, hermanos).</span>';
  burbujaBot(enc).then(()=>{
    dockTexto({tipo:'texto',inputmode:'text',placeholder:'Nombre y dos apellidos',
      omitirTxt:'⏭️ Las completo después',
      omitir:()=>{
        burbujaBot('De acuerdo 👍 '+(datos.referencias.length? 'La referencia que ya llenaste <b>queda guardada</b>; te pediré la que falta al final.' : 'Las <b>referencias</b> quedarán pendientes y te las pediré al final, antes de enviar.')).then(()=>{
          dockChips([{t:'➡️ Continuar', clase:'primario', fn:()=>{ burbujaUser('➡️ Continuar'); dockLimpiar(); terminarBloque(); }}]);
        });
      },
      valida(v){
        const r3 = validaNombre3(v);
        if(!r3.ok) return r3;
        if(datos.conyuge && datos.conyuge.nombre && normTxt(r3.v)===normTxt(datos.conyuge.nombre)) return {ok:false, msg:'La referencia <b>no puede ser el cónyuge</b> 🙏 Ingresa a otra persona.'};
        const asesor = datos.ventaTipo==='Autocompra' ? datos.ventaComprador : datos.ventaVendedor;
        if(asesor && normTxt(r3.v)===normTxt(asesor)) return {ok:false, msg:'La referencia <b>no puede ser el asesor que hace la venta</b> 🙏 Ingresa a otra persona.'};
        if(datos.ventaComprador && normTxt(r3.v)===normTxt(datos.ventaComprador)) return {ok:false, msg:'La referencia <b>no puede ser el mismo cliente</b> 🙏 Ingresa a otra persona.'};
        if(datos.referencias.some(x=>x.nombre && normTxt(x.nombre)===normTxt(r3.v))) return {ok:false, msg:'Esa persona <b>ya está registrada</b> 🙏 El familiar y la referencia personal deben ser personas distintas.'};
        return r3;
      },
      guarda(v){ r.nombre=v; }}, ()=>{
        burbujaBot('¿<b>Celular</b> de '+escapa(primerNombre(r.nombre))+'?').then(()=>{
          dockTexto({tipo:'texto',inputmode:'tel',placeholder:'9 dígitos, empieza con 9',valida:validaCelular,guarda(v){r.celular=v;}}, ()=>{
            burbujaBot('¿<b>Dirección</b> de '+escapa(primerNombre(r.nombre))+'?<span class="peque">Muy recomendada: Rena Ware podría pedirla luego.</span>').then(()=>{
              dockChips([
                {t:'✍️ Ingresar dirección', fn:()=>{
                  burbujaUser('✍️ Ingresar dirección');
                  burbujaBot('Escribe la dirección de '+escapa(primerNombre(r.nombre))+' con <b>calle, número, distrito y departamento</b>.<span class="peque">Ejemplo: Calle San Martín 435, Cayma, Arequipa.</span>').then(()=>{
                    dockTexto({tipo:'textarea',placeholder:'Ej.: Calle San Martín 435, Cayma, Arequipa',
                      valida(v){ return validaCalle(v, 'la dirección'); },
                      guarda(v){ r.direccion=v; }}, ()=>cierraRef());
                  });
                }},
                {t:'⏭️ Saltar por ahora', clase:'secund', fn:()=>{ burbujaUser('⏭️ Saltar por ahora'); r.direccion=''; dockLimpiar(); cierraRef(); }}
              ]);
            });
          });
        });
      });
  });
  function cierraRef(){
    datos.referencias.push(r);
    if(datos.referencias.length<2){ pideReferencia(datos.referencias.length+1); } else { terminarBloque(); }
  }
}

/* Resumen legible de los pagos capturados (uno por línea) */
/* En el modo «solo la constancia» no se elige medio: el dato está en el
   voucher. Sin nombrarlo salía la clave interna, SOLO_CONSTANCIA. */
function etiquetaMedio(medio){
  const m = rwMedio(medio);
  if(m) return m.etiqueta;
  if(medio === 'SOLO_CONSTANCIA') return 'SEGÚN CONSTANCIA';
  return medio || '';
}
function resumenPagosRw(){
  const gs = datos.pagos||[];
  if(!gs.length) return '';
  /* Se arma con las partes que existen: en ese modo no hay banco ni fecha, y
     unirlas igual dejaba separadores sueltos («SOLO_CONSTANCIA · · S/ 550»). */
  return gs.map(g=>[
      etiquetaMedio(g.medio),
      g.bancoDestino || g.bancoOrigen || g.operador || '',
      g.fecha || '',
      g.operacion ? 'op. '+g.operacion : (g.dniPagador ? 'DNI '+g.dniPagador : ''),
      fmtSoles(g.monto||0)
    ].filter(Boolean).join(' · ')).join('\n');
  /* Texto plano, un pago por línea. Antes se unía con '<br>' y el mismo texto
     termina en sitios que NO son HTML —el campo del panel, el PDF del contrato—
     donde el tag salía impreso tal cual. Quien necesite HTML convierte el salto
     de línea; fila() ya lo hace. */
}

       clase:'secund', fn:()=>{ datos.modoPago='soloArchivo'; burbujaUser('📎 Solo la constancia'); dockLimpiar(); luego(); }}
    ]);

function pidePagoRw(n){
  const g = {medio:'', bancoDestino:'', bancoOrigen:'', operador:'', dniPagador:'',
             fecha:'', operacion:'', monto:0};
  const esperadoTotal = esVenta() ? (parseFloat(datos.inicial)||0) : 70;
  const yaPagado = (datos.pagos||[]).reduce((a,x)=>a+(parseFloat(x.monto)||0),0);
  const falta = Math.max(0, esperadoTotal - yaPagado);
  const enc = n===1
    ? (esVenta() ? '¿<b>Cómo se pagó</b> ese monto inicial?'
                 : 'Ya casi terminamos 💪 ¿<b>Cómo se pagó</b> la afiliación de <b>S/ 70</b>?')
    : 'Pago <b>'+n+'</b> 💳 ¿Cómo se hizo?<span class="peque">Falta registrar '+fmtSoles(falta)+'.</span>';

  modoConstancia(()=>{
    if(datos.modoPago === 'soloArchivo'){
      /* Solo se pide el monto: el medio, la fecha y la operación los lleva el
         voucher, y quien recibe el correo los lee de ahí. */
      burbujaBot(n===1
        ? '¿De cuánto fue el pago? 💵<span class="peque">Solo el número, en soles.</span>'
        : 'Pago <b>'+n+'</b> 💳 ¿De cuánto fue?').then(()=>{
        dockTexto({tipo:'texto', inputmode:'decimal', placeholder:'Ej.: 650.00',
          valida(v){
            const num = parseFloat(String(v).replace(/[^\d.]/g,''));
            if(!num || num<=0) return {ok:false, msg:'Escribe un monto válido en soles 🙏'};
            return {ok:true, v:num.toFixed(2)};
          },
          guarda(v){ g.monto=parseFloat(v); g.medio='SOLO_CONSTANCIA'; }}, cierra);
      });
      return;
    }
    burbujaBot(enc+'<span class="peque">Elige tal como figura en Rena Ware.</span>').then(()=>{
      dockChips(RW_MEDIOS_PAGO.map(m=>({t:m.t, fn:()=>{
        g.medio = m.v; burbujaUser(m.t); dockLimpiar(); paso2();
      }})));
    });
  });

  function paso2(){
    if(g.medio==='TARJETA'){
      burbujaBot('¿Con qué <b>operador</b> se pasó la tarjeta?').then(()=>{
        dockChips(RW_OPERADOR_TARJETA.map(o=>({t:o.t, fn:()=>{
          g.operador=o.v; burbujaUser(o.t); dockLimpiar(); pideFecha();
        }})));
      });
      return;
    }
    if(g.medio==='PAGO_COMPRA'){
      burbujaBot('¿Desde qué <b>banco</b> se hizo el pago compra?').then(()=>{
        dockChips(RW_BANCO_ORIGEN.map(b=>({t:b.t, fn:()=>{
          g.bancoOrigen=b.v; burbujaUser(b.t); dockLimpiar(); pideDniPagador();
        }})));
      });
    } else {
      burbujaBot('¿A qué <b>cuenta de Rena Ware</b> se depositó?').then(()=>{
        dockChips(RW_BANCO_DESTINO.map(b=>({t:b.t, fn:()=>{
          g.bancoDestino=b.v; burbujaUser(b.t); dockLimpiar(); pideFecha();
        }})));
      });
    }
  }
  function pideDniPagador(){
    burbujaBot('¿<b>DNI de quien pagó</b>?<span class="peque">Es el DNI con el que se hizo el pago compra en el banco.</span>').then(()=>{
      dockTexto({tipo:'texto', inputmode:'numeric', placeholder:'8 números',
        valida:validaDni, guarda(v){ g.dniPagador=v; }}, pideFecha);
    });
  }
  function pideFecha(){
    burbujaBot('¿<b>Fecha del voucher</b>?<span class="peque">La que figura en la constancia. Formato: DD/MM/AAAA.</span>').then(()=>{
      dockTexto({tipo:'texto', inputmode:'numeric', placeholder:'Solo números: 24082026', maxlength:10,
        valida(v){
          const bruto = String(v).trim();
          /* Se acepta con o sin separadores: 24082026, 24/08/2026, 24-8-2026.
             Ocho dígitos seguidos se parten solos en día, mes y año. */
          const soloNum = bruto.replace(/\D/g,'');
          let m = null;
          if(/^\d{8}$/.test(soloNum)) m = [null, soloNum.slice(0,2), soloNum.slice(2,4), soloNum.slice(4)];
          else if(/^\d{6}$/.test(soloNum)) m = [null, soloNum.slice(0,2), soloNum.slice(2,4), '20'+soloNum.slice(4)];
          else m = bruto.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
          if(!m) return {ok:false, msg:'Escribe la fecha como <b>24082026</b> (día, mes y año seguidos) o <b>24/08/2026</b> 🙏'};
          const d=+m[1], mes=+m[2], a=+(String(m[3]).length===2 ? '20'+m[3] : m[3]);
          if(d<1||d>31||mes<1||mes>12||a<2020||a>2100) return {ok:false, msg:'Esa fecha no parece correcta. Revísala 🙏'};
          const f = new Date(a, mes-1, d);
          if(f > new Date(Date.now()+86400000)) return {ok:false, msg:'La fecha del voucher <b>no puede ser futura</b> 🙏'};
          return {ok:true, v: String(d).padStart(2,'0')+'/'+String(mes).padStart(2,'0')+'/'+a};
        },
        guarda(v){ g.fecha=v; }}, ()=> g.medio==='PAGO_COMPRA' ? pideMonto() : pideOperacion());
    });
  }
  function pideOperacion(){
    const esTar = (g.medio==='TARJETA');
    const pista = esTar
      ? '<span class="peque">En Niubiz y VendeMás son <b>15 dígitos</b>.</span>'
      : '<span class="peque">Aparece en el voucher. Máximo 20 caracteres.</span>';
    burbujaBot('¿<b>Número de operación</b>?'+pista).then(()=>{
      dockTexto({tipo:'texto', inputmode: esTar?'numeric':'text',
        placeholder: esTar?'15 dígitos':'Ej.: 00123456', maxlength: esTar?15:20,
        valida(v){
          const t = String(v).trim().toUpperCase();
          if(!t) return {ok:false, msg:'Escribe el número de operación del voucher 🙏'};
          if(esTar && !/^[0-9]{15}$/.test(t))
            return {ok:false, msg:'En Niubiz y VendeMás el número de operación tiene <b>15 dígitos</b>. Revísalo 🙏'};
          if(t.length>20) return {ok:false, msg:'Máximo <b>20 caracteres</b>. Copia solo el número de operación 🙏'};
          return {ok:true, v:t};
        },
        guarda(v){ g.operacion=v; }}, pideMonto);
    });
  }
  function pideMonto(){
    burbujaBot('¿<b>Monto</b> de este pago?<span class="peque">Solo el número, en soles.</span>').then(()=>{
      dockTexto({tipo:'texto', inputmode:'decimal', placeholder:'Ej.: 650.00',
        valida(v){
          const num = parseFloat(String(v).replace(/[^\d.]/g,''));
          if(!num || num<=0) return {ok:false, msg:'Escribe un monto válido en soles 🙏'};
          return {ok:true, v: num.toFixed(2)};
        },
        guarda(v){ g.monto=parseFloat(v); }}, cierra);
    });
  }
  function cierra(){
    datos.pagos = datos.pagos || [];
    datos.pagos.push(g);
    const etiq = etiquetaMedio(datos.pagos[0].medio);
    if(esVenta()) datos.ventaMedioPago = etiq; else datos.metodoPago = etiq;
    const total = datos.pagos.reduce((a,x)=>a+(parseFloat(x.monto)||0),0);
    const esperado = esVenta() ? (parseFloat(datos.inicial)||0) : 70;
    const resta = +(esperado - total).toFixed(2);
    const seguir = ()=>{ dockLimpiar(); if(editando){ editando=false; irResumen(); } else { avanzar(); } };

    if(resta > 0.01){
      burbujaBot('Van '+fmtSoles(total)+' de '+fmtSoles(esperado)+'. <b>Falta '+fmtSoles(resta)+'</b>. ¿El pago se hizo en partes?').then(()=>{
        dockChips([
          {t:'➕ Agregar otro pago', clase:'primario', fn:()=>{ burbujaUser('➕ Agregar otro pago'); dockLimpiar(); pidePagoRw(datos.pagos.length+1); }},
          {t:'➡️ Continuar así', clase:'secund', fn:()=>{ burbujaUser('➡️ Continuar así'); seguir(); }}
        ]);
      });
      return;
    }
    if(resta < -0.01){
      burbujaBot('Ojo 👀 Los pagos suman '+fmtSoles(total)+', más que la inicial de '+fmtSoles(esperado)+'. Revisa los montos antes de continuar.').then(()=>{
        dockChips([
          {t:'🔄 Volver a registrar los pagos', clase:'primario', fn:()=>{ burbujaUser('🔄 Volver a registrar los pagos'); dockLimpiar(); flujoPagoRw(true); }},
          {t:'➡️ Continuar así', clase:'secund', fn:()=>{ burbujaUser('➡️ Continuar así'); seguir(); }}
        ]);
      });
      return;
    }
    /* El monto cuadra: no hay nada que preguntar, se continúa */
    burbujaBot('Pago registrado ✅ '+fmtSoles(total)+'.').then(seguir);
  }
}

/* --- Lugar de entrega (crédito) --- */
function flujoEntregaCred(){
  const trabOk = !datos.trabajoMismaCasa && datos.trabDireccion && esZonaCreditoTrabajo();
  let msg = '¿Dónde se hará la <b>entrega del pedido</b>?<span class="peque">Pedido: '+escapa(datos.producto)+(datos.adicionales.length?' + '+escapa(datos.adicionales.join(' + ')):'')+'</span>';
  if(!datos.trabajoMismaCasa && datos.trabDireccion && !esZonaCreditoTrabajo()){
    msg += '<span class="peque">La entrega siempre debe ser en zona de crédito; el trabajo está fuera de zona, así que solo puede ser en la casa.</span>';
  }
  burbujaBot(msg).then(()=>{
    const set = (v)=>{
      datos.entregaEn=v;
      datos.entregaDireccion=''; datos.entregaDepartamento=''; datos.entregaProvincia=''; datos.entregaDistrito='';
      burbujaUser(v==='Casa'?'🏠 En su casa':'🏢 En su trabajo'); dockLimpiar(); terminarBloque();
    };
    const ops = [{t:'🏠 En su casa', fn:()=>set('Casa')}];
    if(trabOk) ops.push({t:'🏢 En su trabajo', fn:()=>set('Trabajo')});
    /* No es la regla —la entrega va a la casa o al trabajo—, pero de vez en
       cuando hace falta otra: la casa de un familiar, un local. Se pide
       completa, con su distrito, porque la zona de crédito se decide ahí. */
    ops.push({t:'📍 Otra dirección', clase:'secund', fn:()=>{
      burbujaUser('📍 Otra dirección'); dockLimpiar(); pideEntregaOtra();
    }});
    dockChips(ops);
  });
}

function pideEntregaOtra(){
  burbujaBot('¿En qué <b>distrito</b> se hará la entrega?').then(()=>{
    dockUbigeo('entrega', ()=>{

          valida(v){

          const enZona = ZONAS_CREDITO.has(datos.entregaDepartamento+'|'+
                           datos.entregaProvincia+'|'+datos.entregaDistrito);

            '<span class="peque">Rena Ware pide que la entrega sea en zona autorizada. '+
            'Puedes continuar, pero queda anotado en el registro.</span>').then(()=>{
            dockChips([
              {t:'➡️ Continuar igual', clase:'primario', fn:()=>{

              {t:'↩️ Elegir otro lugar', clase:'secund', fn:()=>{

/* ================== FLUJO ================== */
async function mostrarPaso(id){
  const p = PASOS[id];
  pintaProgreso();
  if(intentaConocidas(id)) return;
  if(p.tipo==='resumen'){ irResumen(); return; }
  if(p.tipo==='pagoRw'){ flujoPagoRw(true); return; }
  if(p.tipo==='notaPedido'){
    /* En autocompra el texto viene puesto porque siempre lo lleva; en el
       resto va vacío para que el asesor escriba lo que haga falta. */
    const sugerido = (datos.ventaTipo === 'Autocompra') ? 'AUTOCOMPRA' : '';
    burbujaBot('¿Quieres <b>agregar una nota</b> al pedido? 📝<span class="peque">'+
      (sugerido ? 'Se enviará como nota del pedido. Puedes editarla.' : 'Opcional. Cualquier indicación para quien procesa el pedido.')+
      '</span>').then(()=>{
      dockTexto({tipo:'textarea', placeholder: sugerido || 'Escribe la nota (opcional)',
        valor: sugerido,
        omitirTxt: sugerido ? '✔️ Dejar «'+sugerido+'»' : '⏭️ Sin nota',
        omitir:()=>{ datos.notaPedido = sugerido; burbujaUser(sugerido || '⏭️ Sin nota'); dockLimpiar();
          if(editando){ editando=false; irResumen(); } else { avanzar(); } },
        valida(v){ return {ok:true, v:String(v||'').trim()}; },
        guarda(v){ datos.notaPedido = v; }},
        ()=>{ if(editando){ editando=false; irResumen(); } else { avanzar(); } });
    });
    return;
  }
  if(p.tipo==='facturaDatos'){
    if(datos.comprobante==='Factura' && datos.ventaTipo!=='Autocompra'){ flujoFactura(); }
    else { avanzar(); }
    return;
  }
  if(p.tipo==='asesorLista'){
    const seguir = ()=>{ if(editando){ editando=false; irResumen(); } else { avanzar(); } };
    eligeAsesor('¿De qué <b>asesor o asesora será este afiliado</b>?', a=>{
      datos.asesorAfiliador = a.nombre;
      datos.asesorCodigo = (a.codigo||'').startsWith('PEND-') ? '' : (a.codigo||'');
      seguir();
    }, nom=>{ datos.asesorAfiliador = nom; seguir(); });
    return;
  }
  if(p.tipo==='vendedor'){
    /* Ya no se pregunta quién registra, así que no hay un "yo mismo" que ofrecer:
       se va directo al buscador de asesores. */
    const yo = '';
    burbujaBot(p.pregunta()).then(()=>{
      const ops = [];
      if(yo) ops.push({t:'🙋 Yo mismo(a) — '+escapa(primerNombre(yo)), clase:'primario', fn:()=>{
        datos.ventaVendedor = yo; burbujaUser('🙋 Yo mismo(a)'); dockLimpiar();
        if(editando){ editando=false; irResumen(); } else { avanzar(); }
      }});
      ops.push({t:'✍️ Otro asesor', clase: yo?'secund':'primario', fn:()=>{
        burbujaUser('✍️ Otro asesor'); dockLimpiar();
        eligeAsesor('¿<b>Qué asesor o asesora</b> realiza la venta?', a=>{
          datos.ventaVendedor = a.nombre;
          datos.asesorCodigo = (a.codigo||'').startsWith('PEND-') ? '' : (a.codigo||'');
          if(editando){ editando=false; irResumen(); } else { avanzar(); }
        }, nom=>{ datos.ventaVendedor = nom; confirmaAsesor(nom); });
      }});
      dockChips(ops);
    });
    return;
  }
  if(p.tipo==='catalogo'){ datos.items = []; upsellOfrecidos = []; pedirProducto(loopProductos, true); return; }
  if(p.tipo==='adicionales'){ if(esVenta()){ avanzar(); return; } loopAdicionales(true); return; }
  if(p.tipo==='condiciones'){ mostrarCondiciones(); return; }
  if(p.tipo==='recibo'){ flujoRecibo(); return; }
  if(p.tipo==='cuotas'){ flujoCuotas(); return; }
  if(p.tipo==='laborales'){ flujoLaborales('Titular', terminarBloque); return; }
  if(p.tipo==='conyuge'){ flujoConyuge(); return; }
  if(p.tipo==='referencias'){ flujoReferencias(); return; }
  if(p.tipo==='entregaCred'){ flujoEntregaCred(); return; }
  await burbujaBot(p.pregunta());
  if(p.tipo==='chips'){
    dockChips(p.opciones.map(o=>({t:o.t, fn:()=>p.alElegir(o.v)})));
  } else if(p.tipo==='foto'){
    fotoCtx='voucher';
    dockFoto(null, ()=>{
      burbujaBot('Sin problema 👍 La <b>constancia</b> quedará como pendiente y te la pediré al final, antes de enviar.').then(()=>{
        dockChips([{t:'➡️ Continuar', clase:'primario', fn:()=>{ burbujaUser('➡️ Continuar'); dockLimpiar(); if(editando){ editando=false; irResumen(); } else { avanzar(); } }}]);
      });
    });
  } else if(p.tipo==='ubigeo'){
    dockUbigeo();
  } else {
    dockTexto(p);
  }
}
function avanzar(){
  pasosHechos++;
  pintaProgreso();
  const sig = cola.shift();
  if(sig){ guardaBorrador(sig); mostrarPaso(sig); return; }
  /* Sin cola no se pintaba nada: el dock se quedaba con los botones de la
     pregunta anterior y el formulario parecía trabado. El final del camino es
     el resumen, así que se va ahí en vez de dejar a nadie colgado. */
  if(datos.tipoRegistro) irResumen();
}
function irResumen(){
  /* Si la corrección salió de la pestaña en medio del formulario, el regreso es
     a la pregunta en la que estaba, no al resumen final. */
  if(retomar){ const s = retomar; retomar = null; retomaPaso(s); return; }
  if(esVenta()) irResumenVenta(); else irResumenAfiliado();
}

/* ================== RESUMEN AFILIADO ================== */
function fila(label, valor){
  /* El valor viaja en texto plano. Si trae varias líneas (dos pagos, por
     ejemplo) aquí se convierten en saltos de verdad, no en un tag escapado. */
  return '<div class="res-item"><div class="res-label">'+label+'</div><div class="res-valor">'+
         escapa(valor).replace(/\n/g,'<br>')+'</div></div>';
}
async function irResumenAfiliado(){
  progTxt.textContent='100%';
  progFill.style.width='100%';
  const quien = datos.registradoPor || datos.ventaVendedor || datos.ventaComprador || datos.asesorAfiliador || '';
  await burbujaBot(quien
    ? '¡Listo, <b>'+escapa(primerNombre(quien))+'</b>! 🎉 Revisa que todo esté correcto:'
    : '¡Listo! 🎉 Revisa que todo esté correcto:');
  const card = document.createElement('div');
  card.className='fila-resumen';
  let html = '<div class="resumen"><h3>Resumen del registro de afiliado</h3>';
  if(datos.esPropio){
    html += fila('Asesor que afilia y registra', conCodigoAsesor(datos.asesorAfiliador));
  }else{
    html += fila('Asesor que afilia', conCodigoAsesor(datos.asesorAfiliador));
  }
  html += fila('Afiliado', datos.nombreAfiliado);
  html += '<div class="res-grid">'+fila(etiquetaDoc(), datos.dni)+fila('Celular', datos.celular)+'</div>';
  if(datos.nacimiento) html += fila('Fecha de nacimiento', datos.nacimiento);
  html += fila('Correo', datos.email);
  html += fila('Ubicación', datos.distrito+' · '+datos.provincia+' · '+datos.departamento);
  html += fila('Dirección', datos.direccion);
  /* Antes solo decía el medio: el número de operación y la fecha del voucher
     son justo lo que se revisa contra el banco. */
  html += '<div class="res-grid">'+fila('Pago de S/ 70', resumenPagosRw() || datos.metodoPago)+
          '<div class="res-item"><div class="res-label">Constancia'+((datos.constancias||[]).length>1?'s ('+datos.constancias.length+')':'')+'</div>'+
          (datos.constancias||[]).map(u=>'<img class="res-foto" src="'+u+'">').join('')+'</div></div>';
  html += '</div>';
  card.innerHTML = html;
  chat.appendChild(card); scrollAbajo();
  cierreResumen(menuCorregirAfiliado, enviarAfiliado);
}
/* ================== ESTADO Y CORRECCIÓN EN CUALQUIER MOMENTO ==================
   El formulario pregunta de a una cosa por vez, y eso se queda: es lo que evita
   errores. Lo que faltaba era poder mirar lo ya respondido y arreglar UN dato sin
   recorrer todo el camino hacia atrás ni esperar al resumen.

   Una sola lista manda: catalogoDatos(). De ahí salen las filas de la pestaña y
   también los chips de "quiero corregir algo" del resumen, así nunca ofrecen
   cosas distintas.

   Al corregir desde la mitad del formulario, el regreso NO es al resumen sino a
   la pregunta en la que se estaba. De eso se encarga `retomar`: todas las
   correcciones terminan llamando a irResumen(), y ahí se intercepta.          */

function retomaPaso(s){
  cola = s.cola.slice();
  pasosHechos = s.pasosHechos;
  totalPasos = s.totalPasos;
  editando = false;
  editandoDireccion = false;
  historial.length = Math.max(0, s.histLen - 1);   // el render vuelve a marcarlo
  pintaProgreso();
  dockLimpiar();
  const seguir = ()=>{
    if(typeof s.render === 'function') s.render();
    else irResumen();
    scrollAbajo();
  };
  if(s.preguntaHtml){
    burbujaBot('Listo ✅ Seguimos donde estábamos.')
      .then(()=>burbujaBot(s.preguntaHtml))
      .then(seguir);
  } else seguir();
}

/* --- Lectores de valor: lo que hay ahora en cada dato --- */
function vSi(x){ return (x===null||x===undefined||x==='') ? '' : String(x); }
function vVivienda(){
  if(!datos.direccion && !datos.distrito) return '';
  return [datos.distrito, datos.provincia].filter(Boolean).join(' · ') +
         (datos.direccion ? ' — '+datos.direccion : '');
}
function vComprobante(){
  let c = vSi(datos.comprobante);
  if(datos.comprobante==='Factura'){
    c += datos.ruc ? ' · RUC '+datos.ruc : ' · (falta RUC)';
    if(datos.razonSocial) c += ' · '+datos.razonSocial;
  }
  return c;
}
function vProducto(){
  const it = (datos.items||[]).map(x=>typeof x === 'string' ? x : nombreConRegalo(x)).filter(Boolean);
  if(it.length) return it.join(' + ');
  return vSi(datos.producto);
}
function vPago(){
  const p = (typeof resumenPagosRw==='function' ? resumenPagosRw() : '') || '';
  /* En la pestaña cada dato ocupa una línea: los pagos se juntan con " + ". */
  return p.replace(/\n/g, '  +  ') || vSi(datos.ventaMedioPago) || vSi(datos.metodoPago);
}
function vConstancias(){
  const n = (datos.constancias||[]).length;
  return n ? (n===1 ? '1 archivo ✔' : n+' archivos ✔') : '';
}
/* Nombre del asesor con su código detrás, o «sin código» cuando no lo tiene:
   el vacío se lee como un olvido y el código es lo que cobra la comisión. */
function etiquetaDoc(){ return datos.tipoDoc==='CE' ? 'Carné de extranjería' : 'DNI'; }
function conCodigoAsesor(nombre){
  const n = String(nombre||'').trim();
  if(!n) return '';
  const c = String(datos.asesorCodigo||'').trim();
  return n + (c ? ' · código '+c : ' · (sin código)');
}
function vRecibo(){
  if(!datos.reciboTipo) return '';
  const mes = datos.reciboMesTexto ? ' · '+datos.reciboMesTexto : '';
  return datos.reciboTipo + mes + (datos.reciboContrato ? ' · N° '+datos.reciboContrato
         : (datos.reciboFotoDataUrl ? ' · archivo ✔'
         : (datos.reciboReusado ? ' · archivo ✔ (el de su compra anterior)' : '')));
}
function vLaborales(){
  const f = (datos.fuentes||[]).filter(x=>x.titular!=='Cónyuge');
  if(datos.sinIngresoTitular) return 'No genera ingresos · sustenta el cónyuge';
  if(!f.length) return '';
  return f.map(x=>[x.fuente, x.cargo, x.empresa||x.institucion,
                   x.sueldo ? fmtSoles(x.sueldo) : ''].filter(Boolean).join(' · ')).join(' | ');
}
function vConyuge(){
  if(datos.conyuge === null) return '';
  if(!datos.conyuge) return 'No tiene';
  if(!datos.conyuge.nombre) return 'Sí tiene · datos pendientes';
  return datos.conyuge.nombre + (datos.sumaConyuge ? ' · suma ingresos ✔' : '');
}
function vReferencias(){
  const r = datos.referencias||[];
  if(!r.length) return '';
  return r.map(x=>x.nombre+(x.celular?' · '+x.celular:'')).join(' | ');
}
function vTipo(){
  if(!datos.tipoRegistro) return '';
  if(!esVenta()) return 'Afiliación';
  return [datos.ventaModalidad, datos.ventaTipo].filter(Boolean).join(' · ') +
         (datos.cuotas ? ' · '+datos.cuotas+' cuotas' : '');
}

/* --- El catálogo: etiqueta, valor actual y cómo se corrige --- */
function catalogoDatos(){
  const L = [];
  /* Antes había dos ayudantes, uno para pasos de texto y otro para pasos de
     chips, y los dos hacían PASOS[id].pregunta(). Los pasos compuestos —el medio
     de pago, el buscador de asesores— no tienen esa función y la corrección
     reventaba con "pregunta is not a function".
     mostrarPaso ya sabe pintar cada tipo de paso: se usa ese y no hay tipo que
     se quede fuera. */
  const editaPaso = (pasoId)=>{ editando = true; mostrarPaso(pasoId); };
  const editaTexto = editaPaso, editaChips = editaPaso;
  const corrigeConstancias = ()=>{ editando=true; fotoCtx='voucher';
    datos.constancias=[]; datos.constanciaDataUrl='';
    burbujaBot(PASOS.foto.pregunta()).then(()=>dockFoto('📎 Subir constancia (foto o PDF)')); };

  L.push({t:'Tipo de registro', v:vTipo()});          // informativo: se elige al inicio

  if(!esVenta()){
    /* ---------- afiliación ---------- */
    if(datos.esPropio){
      L.push({t:'Asesor (afilia y registra)', v:vSi(datos.asesorAfiliador)||vSi(datos.registradoPor),
              fn:()=>editaTexto('nombrePropio')});
    }else{
      L.push({t:'Asesor que afilia', v:vSi(datos.asesorAfiliador), fn:()=>editaTexto('asesorDueno')});
    }
    L.push({t:'Nombre del afiliado', v:vSi(datos.nombreAfiliado), fn:()=>editaTexto('nombreAfiliado')});
    L.push({t:'DNI',      v:vSi(datos.dni),     fn:()=>editaTexto('afiDni')});
    L.push({t:'Nacimiento', v:datos.nacimiento || '— sin llenar (opcional)',
            fn:()=>editaTexto('afiNacimiento')});
    L.push({t:'Celular',  v:vSi(datos.celular), fn:()=>editaTexto('afiCelular')});
    L.push({t:'Correo',   v:vSi(datos.email),   fn:()=>editaTexto('afiCorreo')});
    L.push({t:'Dirección', v:vVivienda(), fn:()=>{ editandoDireccion=true;
              burbujaBot(PASOS.ubicacion.pregunta()).then(()=>dockUbigeo()); }});
    L.push({t:'Medio de pago', v:vPago(), fn:()=>editaChips('pago')});
    L.push({t:'Constancia de pago', v:vConstancias(), fn:corrigeConstancias, icono:'📷'});
    return L;
  }

  /* ---------- venta: contado y crédito ---------- */
  const credito = datos.ventaModalidad === 'Crédito' || datos.cuotas > 0;
  if(datos.ventaTipo==='Venta a terceros'){
    L.push({t:'Asesor que vende', v:vSi(datos.ventaVendedor), fn:()=>editaTexto('ventaVendedor')});
    L.push({t:credito?'Cliente titular':'Cliente', v:vSi(datos.ventaComprador),
            fn:()=>editaTexto('ventaComprador')});
  }else{
    L.push({t:'Asesor / cliente', v:vSi(datos.ventaComprador), fn:()=>editaTexto('ventaComprador')});
  }
  L.push({t:'DNI', v:vSi(datos.ventaDni), fn:()=>editaTexto('ventaDni')});
  L.push({t:'Comprobante', v:vComprobante(), fn:()=>editaChips('comprobante')});
  L.push({t:'Celular', v:vSi(datos.ventaCelular), fn:()=>editaTexto('ventaCelular')});
  L.push({t:'Correo',  v:vSi(datos.ventaCorreo),  fn:()=>editaTexto('ventaCorreo')});
  L.push({t:credito?'Dirección de vivienda':'Dirección de entrega', v:vVivienda(),
          fn:()=>{ editandoDireccion=true;
            burbujaBot(PASOS.ubicacion.pregunta()).then(()=>dockUbigeo(credito?'casa':undefined)); }});
  if(credito) L.push({t:'Recibo de servicios', v:vRecibo(), fn:()=>{ editando=true; flujoRecibo(); }});
  L.push({t:'Producto / promoción', v:vProducto(), fn:()=>{ editando=true;
            datos.items = []; upsellOfrecidos = []; pedirProducto(loopProductos, true); }});
  L.push({t:'Inicial', v:datos.inicial ? fmtSoles(datos.inicial) : '', fn:()=>editaTexto('inicial')});
  if(credito) L.push({t:'Cuotas', v:datos.cuotas?String(datos.cuotas):'',
                      fn:()=>{ editando=true; flujoCuotas(); }});
  L.push({t:'Medio de pago', v:vPago(), fn:()=>editaChips('pagoVenta')});
  L.push({t:'Constancia de pago', v:vConstancias(), fn:corrigeConstancias, icono:'📷'});
  if(credito){
    L.push({t:'Datos laborales', v:vLaborales(), icono:'🗂️', fn:()=>{
      editando=true;
      datos.fuentes = datos.fuentes.filter(x=>x.titular!=='Titular');
      datos.sinIngresoTitular=false;
      datos.trabDepartamento=''; datos.trabProvincia=''; datos.trabDistrito='';
      datos.trabDireccion=''; datos.trabajoMismaCasa=false;
      flujoLaborales('Titular', terminarBloque);
    }});
    L.push({t:'Cónyuge', v:vConyuge(), icono:'💍', fn:()=>{
      editando=true;
      datos.fuentes = datos.fuentes.filter(x=>x.titular!=='Cónyuge');
      datos.conyuge=null; datos.sumaConyuge=false;
      flujoConyuge();
    }});
    L.push({t:'Referencias', v:vReferencias(), icono:'👥',
            fn:()=>{ editando=true; flujoReferencias(true); }});
    L.push({t:'Lugar de entrega', v:textoEntrega(),
            fn:()=>{ editando=true; flujoEntregaCred(); }});
  }
  if(datos.notaPedido !== undefined)
    L.push({t:'Nota del pedido', v:vSi(datos.notaPedido) || '(sin nota)',
            fn:()=>{ editando=true; mostrarPaso('notaPedido'); }});
  return L;
}

function abreEstado(){
  const ult = [...chat.querySelectorAll('.msg.bot')].pop();
  retomar = {
    cola: cola.slice(), pasosHechos: pasosHechos, totalPasos: totalPasos,
    histLen: historial.length,
    render: (historial[historial.length-1]||{}).render,
    preguntaHtml: ult ? ult.innerHTML : ''
  };
  pintaEstado();
}
function cierraEstado(){
  retomar = null;                       // se cierra sin corregir: nada que retomar
  const h = document.getElementById('hojaEstado');
  if(h) h.remove();
}
function pintaEstado(){
  const previo = document.getElementById('hojaEstado');
  if(previo) previo.remove();
  const lista = catalogoDatos();
  const faltan = lista.filter(x=>x.fn && !x.v).length;
  const hoja = document.createElement('div');
  hoja.id = 'hojaEstado';
  hoja.className = 'hoja-fondo';
  hoja.innerHTML =
    '<div class="hoja" role="dialog" aria-label="Lo que llevas registrado">'+
      '<div class="hoja-cab">'+
        '<div><b>Lo que llevas</b><div class="hoja-sub">'+
          (faltan ? faltan+(faltan===1?' dato por responder':' datos por responder') : 'todo respondido')+
          ' · toca cualquier línea para corregirla</div></div>'+
        '<button type="button" class="hoja-x" id="hojaCerrar" aria-label="Cerrar">✕</button>'+
      '</div>'+
      '<div class="hoja-cuerpo">'+
        lista.map((x,i)=>
          '<button type="button" class="hoja-fila'+(x.fn?'':' sin-accion')+'"'+
            (x.fn?' data-i="'+i+'"':' disabled')+'>'+
            '<span class="hoja-et">'+(x.icono?x.icono+' ':'')+escapa(x.t)+'</span>'+
            '<span class="hoja-val'+(x.v?'':' vacio')+'">'+(x.v?escapa(x.v):'falta')+'</span>'+
            (x.fn?'<span class="hoja-lapiz">✏️</span>':'')+
          '</button>').join('')+
      '</div>'+
      /* Faltaba la salida hacia adelante: desde aquí solo se podía volver a
         la pregunta en curso, así que para enviar había que recorrer el
         camino otra vez. El resumen ya avisa de lo que falte. */
      '<div class="hoja-pie">'+
        '<button type="button" class="chip '+(faltan?'primario':'secund')+' ancho" id="hojaSeguir">'+
          '↩️ Seguir donde estaba</button>'+
        '<button type="button" class="chip '+(faltan?'secund':'primario')+' ancho" id="hojaFin">'+
          '✅ Terminar y revisar</button>'+
      '</div>'+
    '</div>';
  document.body.appendChild(hoja);
  const cerrar = ()=>cierraEstado();
  hoja.querySelector('#hojaCerrar').addEventListener('click', cerrar);
  hoja.querySelector('#hojaSeguir').addEventListener('click', cerrar);
  hoja.querySelector('#hojaFin').addEventListener('click', ()=>{
    cierraEstado();                 // suelta el punto de regreso: se va al final
    dockLimpiar();
    irResumen();
  });
  hoja.addEventListener('click', e=>{ if(e.target===hoja) cerrar(); });
  hoja.querySelectorAll('.hoja-fila[data-i]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const x = lista[+b.dataset.i];
      const h = document.getElementById('hojaEstado');
      if(h) h.remove();                 // se cierra pero `retomar` se conserva
      burbujaUser('Corregir: '+x.t);
      x.fn();
    });
  });
}

   Un mismo cliente puede haber comprado con datos distintos (se mudó, cambió
   de celular, una vez lo registraron con la dirección del trabajo). En vez de
   elegir por nosotros la más reciente, se le muestran las versiones y decide. */
async function rpc(nombre, cuerpo){
  if(!CONECTADO) return null;
  try{
    const r = await fetch(SUPABASE_URL+'/rest/v1/rpc/'+nombre, {
      method:'POST', headers:{apikey:SUPABASE_KEY, Authorization:'Bearer '+SUPABASE_KEY,
      'Content-Type':'application/json'}, body: JSON.stringify(cuerpo||{})});
    if(!r.ok) return null;
    return await r.json();
  }catch(e){ return null; }
}

/* Saca pasos de la cola y descuenta lo mismo del total, para que la barra de
   avance no se quede corta cuando el formulario se ahorra preguntas. */
function quitaDeLaCola(ids){
  const antes = cola.length;
  cola = cola.filter(k => ids.indexOf(k) === -1);
  totalPasos -= (antes - cola.length);
}

/* Mete pasos justo antes de otro, sin alterar el resto del orden */
function insertaEnLaCola(antesDe, ids){
  const i = cola.indexOf(antesDe);
  if(i === -1) cola.unshift.apply(cola, ids);
  else cola.splice.apply(cola, [i, 0].concat(ids));
  totalPasos += ids.length;
}

/* En medio del formulario se sigue a la pregunta siguiente; si esto vino de
   una corrección, se vuelve al resumen, que es de donde salió. */

}

  }

     esté: sin DNI se pregunta el documento como siempre, y lo que se escriba

  sumaFichaAsesor(f);

  }

  const o = datos.cliOpc || {};

  if(n(o.celular)>1)   cuenta.push(n(o.celular)+' celulares');
  if(n(o.referencias)) cuenta.push(n(o.referencias)+' referencia'+(n(o.referencias)>1?'s':''));
  if(n(o.fuentes))     cuenta.push(n(o.fuentes)+' trabajo'+(n(o.fuentes)>1?'s':''));

/* Si la autocompra es de un asesor cuya ficha no tenía DNI, el que se acaba de
   escribir queda guardado ahí. La base de asesores se completa con el uso, que
   es la única forma en que se mantiene al día. No pisa un DNI ya cargado y el
   nombre tiene que calzar, para que un código mal elegido no escriba sobre
   otra persona. Va en silencio: es mantenimiento, no una pregunta más. */
function guardaDniEnFichaAsesor(){
  if(datos.ventaTipo !== 'Autocompra') return;
  if(datos.tipoDoc !== 'DNI' || !/^[0-9]{8}$/.test(String(datos.ventaDni||''))) return;
  const f = datos.fichaAsesor;
  if(!f || !f.codigo || String(f.dni||'').trim()) return;
  rpc('completa_dni_asesor', {cod:f.codigo, nom:datos.ventaComprador, doc:datos.ventaDni})
    .then(ok=>{ if(ok) f.dni = datos.ventaDni; });
}

/* Mete lo que dice la ficha del asesor entre las opciones conocidas, para que
   cada paso la ofrezca cuando llegue su turno. Va al final: primero lo que
   realmente usó en compras anteriores, después lo que figura en su ficha. */
function sumaFichaAsesor(f){
  if(!datos.cliOpc) datos.cliOpc = {};
  const o = datos.cliOpc;
  const pon = (campo, item) => {
    if(!Array.isArray(o[campo])) o[campo] = [];
    o[campo].push(Object.assign({fuente:'de su ficha de asesor'}, item));
  };
  const soloDigitos = s => String(s||'').replace(/\D/g,'');
  const yaEsta = (campo, valor, clave) =>
    (o[campo]||[]).some(it => String(it[clave||'valor']||'').trim().toLowerCase()
                              === String(valor||'').trim().toLowerCase());

  if(/^9[0-9]{8}$/.test(soloDigitos(f.celular)) &&
     !(o.celular||[]).some(it => soloDigitos(it.valor) === soloDigitos(f.celular)))
    pon('celular', {valor: soloDigitos(f.celular)});

  if(String(f.correo||'').indexOf('@') > 0 && !yaEsta('correo', f.correo))
    pon('correo', {valor: String(f.correo).trim()});

  if(/^(10|15|17|20)[0-9]{9}$/.test(soloDigitos(f.ruc)) && !yaEsta('factura', f.ruc, 'ruc'))
    pon('factura', {ruc: soloDigitos(f.ruc), ruc_tipo: soloDigitos(f.ruc).slice(0,2),
                    razon_social: ''});
}

/* ---------- La ciudad de un pedido, convertida en ubigeo ----------
   Las compras hechas fuera de este formulario viven en Pedidos y guardan la
   ciudad como texto: «Majes, Caylloma», a veces con el departamento y el país
   detrás, a veces solo el nombre. Se resuelve contra la lista de distritos del
   país —la misma del desplegable—; si no calza o queda ambiguo se devuelve
   vacío y el formulario pregunta el distrito como siempre. */
let _indiceUbigeo = null;
function indiceUbigeo(){
  if(_indiceUbigeo) return _indiceUbigeo;
  const m = new Map();
  Object.keys(UBIGEO).forEach(dep=>Object.keys(UBIGEO[dep]).forEach(prov=>
    UBIGEO[dep][prov].forEach(dist=>{
      const k = normTxt(dist);
      if(!m.has(k)) m.set(k, []);
      m.get(k).push({departamento:dep, provincia:prov, distrito:dist});
    })));
  _indiceUbigeo = m;
  return m;
}
/* Nombres con los que Rena Ware escribe algunos distritos */
const ALIAS_DISTRITO = {'cercado':'arequipa', 'hunter':'jacobo hunter'};
function resuelveCiudad(txt){
  const vacio = {departamento:'', provincia:'', distrito:''};
  const partes = String(txt||'').split(',').map(s=>normTxt(s)).filter(Boolean);
  if(!partes.length) return vacio;
  const idx = indiceUbigeo();
  const prueba = (d, p)=>{
    const lista = idx.get(ALIAS_DISTRITO[d] || d) || [];
    if(!lista.length) return null;
    if(p){
      const exacto = lista.filter(x=>normTxt(x.provincia) === p);
      if(exacto.length === 1) return exacto[0];
      if(exacto.length > 1) return null;
    }
    if(lista.length === 1) return lista[0];
    /* El mismo nombre en varias provincias solo vale si una es la capital de
       la suya: «Piura» o «Tacna» a secas son esas. */
    const cap = lista.filter(x=>normTxt(x.distrito) === normTxt(x.provincia));
    return cap.length === 1 ? cap[0] : null;
  };
  return prueba(partes[0], partes[1]) || prueba(partes[0], '') || vacio;
}
function ubigeoDe(it){
  if(it && it.distrito)
    return {departamento:it.departamento||'', provincia:it.provincia||'', distrito:it.distrito};
  return resuelveCiudad(it && it.ciudad);
}

/* ---------- Documentos que ya subió antes ----------
   Un recibo de luz o una boleta de pago siguen sirviendo para la siguiente
   compra: ya están en el bucket, así que se reusan por su ruta y nadie vuelve
   a buscarlos en el celular. Las constancias de pago no entran aquí —la base
   ya las excluye—: un voucher sustenta un solo pago. */
function docsPrevios(tipo){
  const l = (datos.cliOpc && datos.cliOpc.documentos) || [];
  return l.filter(d => d && d.ruta && (!tipo || d.tipo === tipo));
}

/* Lo marca para que viaje con el registro nuevo sin volver a subirlo */
function reusaDoc(d){
  datos.docsReusados = datos.docsReusados || [];
  if(!datos.docsReusados.some(x=>x.ruta === d.ruta))
    datos.docsReusados.push({nombre:d.nombre, tipo:d.tipo, ruta:d.ruta});
}

/* ---------- Opciones conocidas, campo por campo ----------
   0 conocidas → el paso corre normal.
   1 conocida  → se ofrece esa y la alternativa de escribir otra.
   2 o más     → se ofrecen todas, más "otra". */
function opcionesDe(campo){
  const o = datos.cliOpc;
  return (o && Array.isArray(o[campo])) ? o[campo] : [];
}

function ofreceConocidas(cfg){
  const lista = cfg.lista || opcionesDe(cfg.campo);
  if(!lista.length) return false;
  /* Lo que viene de la ficha del asesor no tiene historia de uso: dice de
     dónde salió en vez de inventar una fecha. */
  const pie = it => it.fuente
    ? escapa(it.fuente)
    : 'usada ' + (it.veces>1 ? it.veces+' veces · ' : '') + 'última el ' + it.ultima;
  const ops = lista.slice(0,6).map((it,idx)=>({
    t: (idx===0 && !it.fuente ? '🕒 ' : '') + cfg.etiqueta(it) +
       '<span class="peque">' + pie(it) + '</span>',
    fn: ()=>{ burbujaUser(cfg.resumen ? cfg.resumen(it) : String(cfg.etiqueta(it)).replace(/<[^>]+>/g,' '));
              dockLimpiar(); cfg.aplicar(it); }
  }));
  ops.push({t: cfg.otraTxt || '✍️ Otra', clase:'secund',
            fn: ()=>{ burbujaUser(cfg.otraTxt || '✍️ Otra'); dockLimpiar(); cfg.otra(); }});
  burbujaBot(cfg.pregunta(lista.length)).then(()=>dockChips(ops, true));
  return true;
}

/* Devuelve true si el paso se resolvió ofreciendo lo que ya sabemos */
function intentaConocidas(id){
  if(!datos.cliOpc || datos._saltaConocidas === id) return false;
  const seguir = ()=>avanzar();
  const escribir = ()=>{ datos._saltaConocidas = id; mostrarPaso(id); };

  if(id==='ventaCelular') return ofreceConocidas({
    campo:'celular', otra:escribir, otraTxt:'✍️ Otro celular',
    pregunta:n=>'¿Usamos el <b>celular</b> que ya tenemos'+(n>1?', o alguno de estos?':'?'),
    etiqueta:it=>'📱 '+escapa(it.valor), resumen:it=>'📱 '+it.valor,
    aplicar:it=>{ datos.ventaCelular=it.valor; seguir(); }});

  if(id==='ventaCorreo') return ofreceConocidas({
    campo:'correo', otra:escribir, otraTxt:'✍️ Otro correo',
    pregunta:n=>'¿Usamos el <b>correo</b> que ya tenemos'+(n>1?', o alguno de estos?':'?'),
    etiqueta:it=>'✉️ '+escapa(it.valor), resumen:it=>'✉️ '+it.valor,
    aplicar:it=>{ datos.ventaCorreo=it.valor; seguir(); }});

  /* La dirección arrastra su ubigeo: al elegirla se salta también ese paso */
  if(id==='ubicacion' || id==='direccion') return ofreceConocidas({
    campo:'domicilio', otra:escribir, otraTxt:'✍️ Otra dirección',
    pregunta:n=> n>1
      ? 'Tiene <b>'+n+' direcciones</b> registradas. ¿Cuál corresponde a esta venta?'
      : '¿La entrega va a la <b>dirección que ya tenemos</b>?',
    etiqueta:it=>{
      const u = ubigeoDe(it);
      return '📍 '+escapa(it.direccion)+'<br><span class="peque">'+
        escapa([u.distrito,u.provincia,u.departamento].filter(Boolean).join(' · ')
               || it.ciudad || '')+'</span>';
    },
    resumen:it=>'📍 '+it.direccion,
    aplicar:it=>{
      const u = ubigeoDe(it);
      datos.direccion = it.direccion;
      if(u.distrito){
        datos.departamento=u.departamento; datos.provincia=u.provincia; datos.distrito=u.distrito;
        cola = cola.filter(k=>k!=='ubicacion' && k!=='direccion');
      }else{
        /* La dirección sirve igual, pero sin ubigeo reconocido no se puede
           decidir la zona de crédito: se queda la pregunta del distrito. */
        cola = cola.filter(k=>k!=='direccion');
      }
      seguir();
    }});

  /* El paso «ruc» es el de la autocompra; «facturaDatos», el de la venta a
     terceros. Los dos piden lo mismo, así que los dos ofrecen lo conocido. */
  if(id==='ruc'){
    /* En crédito el tipo de RUC viene impuesto: no se ofrece uno que no calce */
    const lista = opcionesDe('factura').filter(it =>
      !datos.rucTipo || String(it.ruc||'').slice(0,2) === datos.rucTipo);
    if(!lista.length) return false;
    return ofreceConocidas({
      campo:'factura', lista:lista, otra:escribir, otraTxt:'✍️ Otro RUC',
      pregunta:n=>'¿Facturamos al <b>RUC</b> que ya tenemos'+(n>1?', o a otro de estos?':'?'),
      etiqueta:it=>'🧾 '+escapa(it.ruc)+(it.razon_social?'<br><span class="peque">'+escapa(it.razon_social)+'</span>':''),
      resumen:it=>'🧾 '+it.ruc,
      aplicar:it=>{ datos.ruc=it.ruc; datos.rucTipo=it.ruc_tipo||String(it.ruc).slice(0,2);
                    if(it.razon_social) datos.razonSocial=it.razon_social;
                    seguir(); }});
  }

  if(id==='facturaDatos' && datos.comprobante==='Factura') return ofreceConocidas({
    campo:'factura', otra:escribir, otraTxt:'✍️ Otro RUC',
    pregunta:n=>'¿Facturamos al <b>RUC</b> que ya tenemos'+(n>1?', o a otro de estos?':'?'),
    etiqueta:it=>'🧾 '+escapa(it.ruc)+(it.razon_social?'<br><span class="peque">'+escapa(it.razon_social)+'</span>':''),
    resumen:it=>'🧾 '+it.ruc,
    aplicar:it=>{ datos.ruc=it.ruc; datos.rucTipo=it.ruc_tipo||String(it.ruc).slice(0,2);
                  datos.razonSocial=it.razon_social||''; seguir(); }});

  return false;
}


/* ---------- 2 bis. Lista completa de asesores para el desplegable ---------- */
/* La lista se guardaba para toda la sesión: si en el panel se corregía un
   código o un DNI, el formulario seguía ofreciendo el viejo hasta recargar.
   Se refresca cada 3 minutos, que es poco para el uso y suficiente para que
   una corrección se vea el mismo día. */
let _asesoresCache = null, _asesoresCacheHora = 0;
const ASESORES_VIGENCIA = 3 * 60 * 1000;
function olvidaAsesores(){ _asesoresCache = null; _asesoresCacheHora = 0; }
async function listaAsesores(){
  if(_asesoresCache && (Date.now() - _asesoresCacheHora) < ASESORES_VIGENCIA) return _asesoresCache;
  if(!CONECTADO) return _asesoresCache || [];
  try{
    const r = await fetch(SUPABASE_URL+'/rest/v1/rpc/listar_asesores', {
      method:'POST', headers:{apikey:SUPABASE_KEY, Authorization:'Bearer '+SUPABASE_KEY,
      'Content-Type':'application/json'}, body:'{}'});
    if(r.ok){ _asesoresCache = await r.json(); _asesoresCacheHora = Date.now(); return _asesoresCache; }
  }catch(e){}
  return _asesoresCache || [];   /* sin señal, mejor la de antes que ninguna */
}
/* Coincidencia por palabras sueltas, en cualquier orden.
   "chef cubiertos" encuentra "JUEGO CHEF II + CUBIERTOS". */
function coincidePalabras(texto, consulta){
  const t = normTxt(texto);
  return normTxt(consulta).split(/\s+/).filter(Boolean).every(w => t.includes(w));
}

/* ¿Son la misma persona escrita distinto? Dos palabras largas compartidas,
   sin importar el orden ni las tildes: «Helen Coska Cordova» y «HELEN KOSKA
   CORDOVA» sí; «Flores Jahuira» y «Mamani Jahuira» no, que comparten una
   sola. Es la misma regla que mismo_nombre() en la base, para que el
   formulario y las consultas digan lo mismo. */
function mismaPersona(a, b){
  const palabras = s => normTxt(s).replace(/,/g,' ').split(/\s+/).filter(w=>w.length>=4);
  const A = palabras(a), B = new Set(palabras(b));
  return A.filter(w=>B.has(w)).length >= 2;
}

/* Escribe el nombre y, si hay coincidencias en el equipo, aparecen debajo.

function eligeAsesor(titulo, alElegir, alEscribir){
  burbujaBot(titulo+'<span class="peque">Escribe el nombre; si está en el equipo aparecerá debajo con su código.</span>').then(()=>{

/* ---------- 2. Asesor: se busca en la base del equipo ---------- */
async function confirmaAsesor(nombre){
  const seguir = ()=>{ if(editando){ editando=false; irResumen(); } else { avanzar(); } };
  if(!CONECTADO){ seguir(); return; }
  let lista = [];
  try{
    const r = await fetch(SUPABASE_URL+'/rest/v1/rpc/buscar_asesor', {
      method:'POST', headers:{apikey:SUPABASE_KEY, Authorization:'Bearer '+SUPABASE_KEY,
      'Content-Type':'application/json'}, body: JSON.stringify({q: nombre})});
    if(r.ok) lista = await r.json();
  }catch(e){}
  const exacto = lista.find(a=>normTxt(a.nombre)===normTxt(nombre));
  if(exacto){
    datos.ventaVendedor = exacto.nombre;
    datos.asesorCodigo = exacto.codigo.startsWith('PEND-') ? '' : exacto.codigo;
    seguir(); return;
  }
  if(lista.length){
    burbujaBot('¿Es alguno de estos?<span class="peque">Así tomo su código de Rena Ware.</span>').then(()=>{
      const ops = lista.slice(0,5).map(a=>({t:'👤 '+escapa(a.nombre), fn:()=>{
        datos.ventaVendedor = a.nombre;
        datos.asesorCodigo = a.codigo.startsWith('PEND-') ? '' : a.codigo;
        burbujaUser('👤 '+a.nombre); dockLimpiar(); seguir();
      }}));
      ops.push({t:'➕ No, es otra persona', clase:'secund', fn:()=>{
        burbujaUser('➕ Es otra persona'); dockLimpiar(); confirmaNuevo(nombre, seguir);
      }});
      dockChips(ops);
    });
    return;
  }
  confirmaNuevo(nombre, seguir);
}

/* ---------- 13. Alguien que ya está en la base ----------
   Se dispara al escribir el documento, cuando no se eligió del desplegable.
   Antes volcaba todo de golpe y saltaba hasta el pedido: con eso un crédito
   se quedaba sin referencias, sin laborales y sin lugar de entrega, y el
   asesor se enteraba recién en el aviso de «falta completar» del final.
   Ahora carga lo que sabemos y sigue el orden de siempre: cada pregunta
   ofrece su dato para confirmarlo de un toque o cambiarlo. */
async function buscaClienteConocido(){
  const seguir = ()=>sigueOVuelve();
  if(!CONECTADO || !esVenta() || datos.clienteRecuperado){ seguir(); return; }
  let c = null;
  try{
    const r = await fetch(SUPABASE_URL+'/rest/v1/rpc/buscar_cliente', {
      method:'POST', headers:{apikey:SUPABASE_KEY, Authorization:'Bearer '+SUPABASE_KEY,
      'Content-Type':'application/json'}, body: JSON.stringify({doc: datos.ventaDni})});
    if(r.ok) c = await r.json();
  }catch(e){}
  if(!c || !c.titular){ seguir(); return; }

  /* Puede venir de una afiliación y no de una compra: se dice cuál es. */
  const desde = c.compras > 0
    ? 'última compra: '+escapa(c.ultima_compra||'—')
    : 'se afilió el '+escapa(c.ultima_compra||'—');

  burbujaBot('Ya lo tenemos registrado 🙌<span class="peque">'+escapa(c.titular)+' · '+desde+
    '</span>¿Uso sus datos para no volver a escribirlos?').then(()=>{
    dockChips([
      {t:'✅ Sí, usar lo que ya tenemos', clase:'primario', fn:async ()=>{
        burbujaUser('✅ Sí, usar lo que ya tenemos');
        dockLimpiar();
        datos.clienteRecuperado = true;
        datos.ventaComprador = c.titular || datos.ventaComprador;
        datos.cliOpc = await rpc('opciones_cliente', {doc: datos.ventaDni}) || {};
        /* Si el comprador es un asesor, su ficha vuelve a la mesa de opciones */
        if(datos.fichaAsesor) sumaFichaAsesor(datos.fichaAsesor);
        burbujaBot('Listo ✅ Te voy mostrando lo que ya sé de <b>'+escapa(primerNombre(c.titular))+
          '</b> en cada paso.<span class="peque">Confirmas con un toque, o escribes otro dato si cambió.</span>')
          .then(seguir);
      }},
      {t:'✍️ No, ingresar desde cero', clase:'secund', fn:()=>{
        burbujaUser('✍️ Ingresar desde cero'); dockLimpiar(); seguir();
      }}
    ]);
  });
}

/* Datos económicos del pedido, para que el admin los reciba ya calculados */
function datosPedido(){
  if(!esVenta()) return null;
  const t = totalesPedido();
  if(!t.total) return null;
  const cod = (datos.items||[]).map(i=>i.codigo).filter(Boolean).join(' + ');
  if(!esCredito()) return {codigo_promocion:cod, precio_total:t.total};
  const n = datos.cuotas || 0, cuota = datos.cuotaMensual || 0;
  const saldo = r2(t.total - (datos.inicial||0)), gastos = REGLAS.gastoMensual * n;
  return {codigo_promocion:cod, precio_total:t.total, cuota_mensual:cuota,
    gastos_comisiones:gastos, intereses_totales: n ? r2(cuota*n - saldo - gastos) : null};
}

/* Envía todo con una sola llamada segura. Devuelve {ok, codigo} */
async function rwEnviar(reg, archivos){
  if(!CONECTADO){ console.log('REGISTRO (modo prueba):', reg); return {ok:true, prueba:true}; }
  try{
    /* 1. Subir los archivos al bucket privado */
    const docs = [];
    for(const a of (archivos||[])){
      if(!a || !a.dataUrl) continue;
      try{
        const ruta = await sbSubir(a.dataUrl, a.nombre);
        docs.push({nombre:a.nombre, tipo:a.tipo, ruta:ruta});
        if(a.original && a.original !== a.nombre) console.info('adjunto', a.nombre, '← original:', a.original);
      }catch(e){ console.warn('No se pudo subir', a.nombre, e); }
    }
    /* Los que vienen de una compra anterior ya están en el bucket: viajan por
       su ruta, sin volver a subirse. El archivo queda compartido por los dos
       registros, que es justamente la idea. */
    (datos.docsReusados||[]).forEach(d=>{
      if(d && d.ruta && !docs.some(x=>x.ruta===d.ruta))
        docs.push({nombre:d.nombre, tipo:d.tipo, ruta:d.ruta});
    });
    /* 2. Armar el paquete completo */
    const fila = filaRegistro();
    const personas = [];
    if(fila.titular) personas.push({rol:'titular', nombre:fila.titular, dni:fila.dni, celular:fila.celular});
    if(reg.conyuge && reg.conyuge.nombre) personas.push({rol:'conyuge',
      nombre:reg.conyuge.nombre, dni:reg.conyuge.dni||'', celular:reg.conyuge.celular||''});
    const paquete = {
      registro: fila,
      items: (datos.items||[]).map((it,k)=>({orden:k+1, lista:it.lista, codigo:it.codigo, regalo:it.regalo||'',
        nombre:it.nombre, precio_cliente:it.precio, precio_asesor:it.precioAsesor})),
      personas: personas,
      documentos: docs,
      pedido: datosPedido(),
      detalle: reg
    };
    delete paquete.registro.detalle;
    /* 3. Una sola llamada */
    const r = await fetch(SUPABASE_URL+'/rest/v1/rpc/crear_registro', {
      method:'POST',
      headers:{apikey:SUPABASE_KEY, Authorization:'Bearer '+SUPABASE_KEY, 'Content-Type':'application/json'},
      body: JSON.stringify({datos: paquete})
    });
    if(!r.ok) throw new Error('Supabase '+r.status+': '+(await r.text()));
    const j = await r.json();
    return {ok:true, codigo: j && j.codigo};
  }catch(e){
    console.error('Error al enviar a Supabase:', e);
    return {ok:false, error: String(e.message||e)};
  }
}

/* Trae las listas y productos desde Supabase; si falla, usa los embebidos */
async function cargaCatalogo(){
  if(!CONECTADO) return;
  try{
    const cab = {apikey:SUPABASE_KEY, Authorization:'Bearer '+SUPABASE_KEY};
    const [ls, ps, fs, rg] = await Promise.all([
      fetch(SUPABASE_URL+'/rest/v1/v_listas_vigentes?select=*&order=orden', {headers:cab}).then(r=>r.json()),
      fetch(SUPABASE_URL+'/rest/v1/productos?activo=eq.true&select=lista_id,codigo,nombre,categoria,precio,valor_comisionable,puntos,regalo&order=orden', {headers:cab}).then(r=>r.json()),
      fetch(SUPABASE_URL+'/rest/v1/factores_credito?activo=eq.true&select=meses,factor', {headers:cab}).then(r=>r.json()),
      fetch(SUPABASE_URL+'/rest/v1/reglas_credito?id=eq.vigente&select=*', {headers:cab}).then(r=>r.json())
    ]);
    if(Array.isArray(ls) && ls.length && Array.isArray(ps) && ps.length){
      LISTAS.length = 0;
      ls.forEach(l=>LISTAS.push({id:l.id, nombre:l.nombre, mezcla:l.se_mezcla, credito:l.permite_credito,
        autocompra:l.permite_autocompra, soloTerceros:l.solo_terceros, aviso:l.aviso||'',
        requiere:l.requiere_alguna_de||null, maxItems:l.max_items||null, pregunta:l.pregunta||'',
        exenta:!!l.exenta_minimos}));
      const vigentes = new Set(LISTAS.map(l=>l.id));
      PRODUCTOS.length = 0;
      ps.filter(p=>vigentes.has(p.lista_id)).forEach(p=>PRODUCTOS.push({l:p.lista_id, c:p.codigo,
        n:p.nombre, g:p.categoria||'', p:Number(p.precio), vc:Number(p.valor_comisionable||0),
        pts:p.puntos||0, r:(p.regalo||'').trim()}));
    }
    if(Array.isArray(fs) && fs.length){ fs.forEach(f=>{ FACTORES[f.meses] = Number(f.factor); }); }
    if(Array.isArray(rg) && rg.length){
      const r = rg[0];
      REGLAS.pctInicial = Number(r.pct_inicial_minima);
      REGLAS.saldoMinimo = Number(r.saldo_minimo);
      REGLAS.cuotaMinima = Number(r.cuota_minima);
      REGLAS.gastoMensual = Number(r.gasto_mensual);
      REGLAS.contadoTotal = Number(r.contado_minimo_100);
    }
  }catch(e){ console.warn('No se pudo cargar el catálogo desde Supabase, se usan los precios embebidos:', e); }
}

/* La extensión sale del contenido real, no del nombre que traía el archivo.
   Rena Ware pide JPEG por correo, y en el portal los adjuntos cuyo nombre
   viene de una captura ("Screenshot 2026-09-07 at...") no se visualizan. */
function extDeDataUrl(u){
  const m = String(u||'').match(/^data:([^;,]+)/);
  const t = (m ? m[1] : '').toLowerCase();
  if(t.includes('pdf')) return 'pdf';
  if(t.includes('png')) return 'png';
  return 'jpg';
}

/* Junta las fotos y sustentos que se hayan tomado */
function archivosDeRegistro(){
  const out = [];
  (datos.constancias||[]).forEach((u,i)=>
    out.push({dataUrl:u, nombre:'constancia-'+(i+1)+'.'+extDeDataUrl(u), tipo:'constancia'}));
  if(datos.reciboFotoDataUrl)
    out.push({dataUrl:datos.reciboFotoDataUrl,
              nombre:'recibo-servicios.'+extDeDataUrl(datos.reciboFotoDataUrl), tipo:'recibo'});
  (datos.fuentes||[]).forEach((f,i)=>{
    (f.sustentos||[]).forEach((s,k)=>{
      if(!s.thumb) return;
      /* Nombre propio y predecible: el original se guarda aparte, no en la ruta */
      const et = (s.tipo||'sustento').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
      out.push({dataUrl:s.thumb,
                nombre:'sustento-'+(i+1)+'-'+(k+1)+(et?'-'+et:'')+'.'+extDeDataUrl(s.thumb),
                tipo:'sustento', original:s.name||''});
    });
  });
  return out;
}

/* ================== FALTANTES Y PENDIENTES ================== */
function faltantes(){
  const f = [];
  /* Sin medio de pago el pedido no se puede ingresar en Rena Ware, así que
     es tan obligatorio como la constancia. */
  if(!(datos.pagos||[]).length && !(esVenta() ? datos.ventaMedioPago : datos.metodoPago))
    f.push({txt:'Medio de pago', fn:()=>{ editando=true; flujoPagoRw(true); }});
  if(!(datos.constancias||[]).length) f.push({txt:'Foto de la constancia de pago', fn:()=>{
    editando=true; fotoCtx='voucher';
    burbujaBot(PASOS.foto.pregunta()).then(()=>dockFoto('📎 Subir constancia (foto o PDF)'));
  }});
  if(esCredito()){
    if(!datos.reciboTipo || (!datos.reciboContrato && !datos.reciboFotoDataUrl && !datos.reciboReusado)) f.push({txt:'Recibo de servicios de la vivienda', fn:()=>{ editando=true; flujoRecibo(); }});
    if(!datos.fuentes.length && !datos.sinIngresoTitular) f.push({txt:'Fuente de ingreso', fn:()=>{ editando=true; flujoLaborales('Titular', terminarBloque); }});
    if(datos.referencias.filter(r=>r.nombre && r.celular).length < 2) f.push({txt:'2 referencias personales', fn:()=>{ editando=true; flujoReferencias(); }});
    if(!datos.entregaEn) f.push({txt:'Lugar de entrega', fn:()=>{ editando=true; flujoEntregaCred(); }});
  }
  return f;
}
function pendientes(){
  const p = [];
  if(!esCredito()) return p;
  if(!datos.fuentes.some(x=>(x.sustentos||[]).length)) p.push('Sustentos de ingreso (muy recomendados)');
  if(datos.conyuge && datos.conyuge.tiene && (!datos.conyuge.nombre || !datos.conyuge.dni || !datos.conyuge.celular)) p.push('Datos completos del cónyuge');
  if(datos.referencias.some(r=>r.nombre && !r.direccion)) p.push('Dirección de las referencias');
  return p;
}
function cierreResumen(menuFn, enviarFn){
  const falta = faltantes();
  const pend = pendientes();
  if(pend.length && !falta.length){
    const d = document.createElement('div');
    d.className='fila-resumen';
    d.innerHTML = '<div class="aviso-pend"><b>Puedes enviar así</b>, pero quedan datos opcionales sin llenar:<ul><li>'+pend.map(escapa).join('</li><li>')+'</li></ul></div>';
    chat.appendChild(d); scrollAbajo();
  }
  if(falta.length){
    const d = document.createElement('div');
    d.className='fila-resumen';
    d.innerHTML = '<div class="aviso-falta"><b>⚠️ Falta completar antes de enviar</b><ul><li>'+falta.map(x=>escapa(x.txt)).join('</li><li>')+'</li></ul>'+
      (pend.length?'<div class="peque" style="margin-top:6px">Opcionales que también puedes completar: '+pend.map(escapa).join(' · ')+'</div>':'')+'</div>';
    chat.appendChild(d); scrollAbajo();
    const ops = falta.map(x=>({t:'✍️ '+x.txt, fn:()=>{ burbujaUser('✍️ '+x.txt); x.fn(); }}));
    ops.push({t:'✏️ Corregir otro dato', clase:'secund ancho', fn:menuFn});
    dockChips(ops, true);
    return;
  }
  dockChips([
    {t:'✅ Todo está bien, enviar', clase:'exito-btn', fn:enviarFn},
    {t:'✏️ Quiero corregir algo', clase:'secund', fn:menuFn}
  ]);
}

/* ================== IMAGEN RESUMEN DEL PEDIDO ================== */
function diasHabiles(desde, n){
  const d = new Date(desde.getTime());
  let c = 0;
  while(c < n){
    d.setDate(d.getDate()+1);
    const dw = d.getDay();
    if(dw!==0 && dw!==6) c++;
  }
  return d;
}
function fmtFecha(d){
  const dias = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
  const meses = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','setiembre','octubre','noviembre','diciembre'];
  return dias[d.getDay()]+' '+d.getDate()+' de '+meses[d.getMonth()];
}
function generaImagenPedido(){
  const W = 1000;
  const cv = document.createElement('canvas');
  const ctx = cv.getContext('2d');
  const M = 56;                      // margen
  const azul = '#0E3A5D';

  // 1) Armar las líneas
  const pedido = datos.producto + (datos.adicionales.length ? ' + '+datos.adicionales.join(' + ') : '');
  const cliente = datos.ventaComprador || datos.nombreAfiliado || '';
  const filas = [];
  filas.push(['Cliente', cliente + (datos.ventaDni ? '  ·  DNI '+datos.ventaDni : '')]);
  filas.push(['Su pedido', pedido]);
  if(esCredito()){
    filas.push(['Forma de pago', 'Crédito · inicial '+fmtSoles(datos.inicial)+' · '+datos.cuotas+' cuotas']);
  } else if(esVenta()){
    filas.push(['Forma de pago', 'Contado · inicial '+fmtSoles(datos.inicial)]);
  }
  filas.push(['Dirección de casa', datos.direccion+', '+datos.distrito+', '+datos.provincia]);
  if(datos.trabDireccion && !datos.trabajoMismaCasa){
    filas.push(['Dirección de trabajo', datos.trabDireccion+', '+datos.trabDistrito]);
  }
  if(datos.fuentes.length){
    const fs = datos.fuentes.map(x=>x.fuente+' — '+x.dedicacion+(x.empresa && x.empresa!=='Sin nombre' ? ' ('+x.empresa+')' : '')).join('  |  ');
    filas.push(['Fuente de ingreso', fs]);
  }
  if(datos.entregaEn) filas.push(['Entrega del pedido', textoEntrega().replace(/^[^ ]+ /,'')]);
  if(datos.referencias && datos.referencias.length){
    filas.push(['Referencias', datos.referencias.map(r=>r.nombre).join('  |  ')]);
  }

  // 2) Medir alto (word wrap)
  const anchoTxt = W - M*2 - 300;
  const envolver = (txt, max)=>{
    const pal = String(txt).split(' ');
    const out = []; let ln = '';
    pal.forEach(p=>{
      const prueba = ln ? ln+' '+p : p;
      if(ctx.measureText(prueba).width > max && ln){ out.push(ln); ln = p; }
      else ln = prueba;
    });
    if(ln) out.push(ln);
    return out;
  };
  ctx.font = '30px sans-serif';
  let alto = 250;
  const medidas = filas.map(([k,v])=>{
    const ls = envolver(v, anchoTxt);
    alto += Math.max(1, ls.length)*42 + 26;
    return ls;
  });
  alto += esCredito() ? 300 : 240;
  cv.width = W; cv.height = alto;
  const c = cv.getContext('2d');

  // 3) Dibujar
  c.fillStyle = '#FFFFFF'; c.fillRect(0,0,W,alto);
  c.fillStyle = azul; c.fillRect(0,0,W,150);
  c.fillStyle = '#FFFFFF';
  c.font = 'bold 44px sans-serif';
  c.fillText('Detalle de su pedido', M, 72);
  c.font = '28px sans-serif';
  c.fillStyle = '#BFE3F7';
  c.fillText('Rena Ware del Perú  ·  Registrado el '+new Date().toLocaleDateString('es-PE'), M, 116);

  let y = 220;
  filas.forEach(([k,v], i)=>{
    c.fillStyle = '#5A6B7A'; c.font = 'bold 26px sans-serif';
    c.fillText(String(k).toUpperCase(), M, y);
    c.fillStyle = '#12212E'; c.font = '30px sans-serif';
    let yy = y;
    medidas[i].forEach(ln=>{ c.fillText(ln, M+300, yy); yy += 42; });
    y = Math.max(y+42, yy) + 26;
    c.strokeStyle = '#E4EBF1'; c.lineWidth = 2;
    c.beginPath(); c.moveTo(M, y-30); c.lineTo(W-M, y-30); c.stroke();
  });

  // 4) Pie: tiempos estimados
  const d1 = diasHabiles(new Date(), 1), d2 = diasHabiles(new Date(), 2);
  const alt = esCredito() ? 260 : 200;
  c.fillStyle = '#EAF4FB';
  c.fillRect(M, y-8, W-M*2, alt);
  c.fillStyle = azul; c.font = 'bold 30px sans-serif';
  c.fillText('Tiempos estimados', M+28, y+42);
  c.font = '26px sans-serif'; c.fillStyle = '#12212E';
  let yl = y+86;
  if(esCredito()){
    c.fillText('📞 Llamada de verificación: entre el '+fmtFecha(d1)+' y el '+fmtFecha(d2)+',', M+28, yl); yl += 36;
    c.fillText('    de 1 a 2 días hábiles después del ingreso del pedido.', M+28, yl); yl += 42;
    c.fillText('📦 Entrega del pedido: de 1 a 2 días hábiles después de', M+28, yl); yl += 36;
    c.fillText('    la aprobación del crédito.', M+28, yl); yl += 42;
    c.fillStyle = azul; c.font = 'bold 26px sans-serif';
    c.fillText('⏱️ Tiempo total estimado: de 3 a 5 días hábiles.', M+28, yl); yl += 34;
    c.fillStyle = '#5A6B7A'; c.font = '23px sans-serif';
    c.fillText('No se cuentan sábados, domingos ni feriados.', M+28, yl);
  } else {
    c.fillText('📦 Entrega del pedido: de 1 a 2 días hábiles.', M+28, yl); yl += 36;
    c.fillStyle = '#5A6B7A'; c.font = '23px sans-serif';
    c.fillText('No se cuentan sábados, domingos ni feriados.', M+28, yl);
  }

  return cv.toDataURL('image/jpeg', 0.9);
}
function mensajeCliente(){
  const d1 = diasHabiles(new Date(), 1), d2 = diasHabiles(new Date(), 2);
  return 'Hola '+primerNombre(datos.ventaComprador)+', le comparto el *detalle de su pedido Rena Ware*.'+
    (esCredito()
      ? '\n\nRecibirá una *llamada de verificación* entre el '+fmtFecha(d1)+' y el '+fmtFecha(d2)+'.'+
        '\nLa entrega se realiza de 1 a 2 días hábiles después de la aprobación del crédito (en total, de 3 a 5 días hábiles).'
      : '\n\nLa entrega se realiza de 1 a 2 días hábiles.')+
    '\n\nLe adjunto la imagen con todos los detalles para que los confirme. ¡Gracias por su confianza!';
}
function dockCompartirPedido(){
  sinAtras = true; pintaAtras();
  dockLimpiar();
  const c = document.createElement('div'); c.className='chips';
  const bEnv = document.createElement('button');
  bEnv.className='chip primario';
  bEnv.textContent='📤 Descargar y enviar detalles al cliente';
  bEnv.addEventListener('click', ()=>{
    let url;
    try{ url = generaImagenPedido(); }
    catch(e){ burbujaBot('No pude generar la imagen en este dispositivo 😕 Puedes tomar una captura del resumen y enviarla.'); return; }
    burbujaUserFoto(url);
    const a = document.createElement('a');
    a.href = url; a.download = 'pedido-'+(datos.ventaComprador||'cliente').replace(/\s+/g,'-').toLowerCase()+'.jpg';
    document.body.appendChild(a); a.click(); a.remove();
    dockLimpiar();
    burbujaBot('Descargué la imagen 📥 Ahora toca el botón para abrir el WhatsApp de <b>'+escapa(primerNombre(datos.ventaComprador))+'</b> con el mensaje listo, y adjunta la imagen que acabas de descargar.').then(()=>{
      const c2 = document.createElement('div'); c2.className='chips';
      const bWa = chipWhatsApp('💬 Abrir WhatsApp de '+primerNombre(datos.ventaComprador), datos.ventaCelular, mensajeCliente());
      const bN = document.createElement('button');
      bN.className='chip secund'; bN.textContent='➕ Hacer otro registro';
      bN.addEventListener('click', otroRegistroEnEstaPestana);
      c2.appendChild(bWa); c2.appendChild(bN);
      dockInner.appendChild(c2);
    });
  });
  const bNuevo = document.createElement('button');
  bNuevo.className='chip secund'; bNuevo.textContent='➕ Hacer otro registro';
  bNuevo.addEventListener('click', otroRegistroEnEstaPestana);
  c.appendChild(bEnv); c.appendChild(bNuevo);
  dockInner.appendChild(c);
}

/* ================== INICIO ================== */
function restauraBorrador(b){
  Object.keys(datos).forEach(k=>{ delete datos[k]; });
  Object.assign(datos, JSON.parse(JSON.stringify(DATOS_VACIOS)));
  Object.assign(datos, b.datos);
  fijaBorradorDePestana(b.id || borradorActual);
  cola = b.cola.slice();
  totalPasos = b.totalPasos;
  pasosHechos = b.pasosHechos - 1;
  historial = [];
  sinAtras = false;
  // Si por espacio se perdieron fotos ya tomadas, se vuelven a pedir
  if(datos.ventaMedioPago && !(datos.constancias||[]).length && cola.indexOf('foto')===-1){ cola.unshift('foto'); totalPasos++; }
  if(datos.reciboTipo && datos.reciboTipo!=='' && !datos.reciboContrato && !datos.reciboFotoDataUrl && !datos.reciboReusado && cola.indexOf('reciboServicios')===-1 && cola.indexOf('foto')===-1){ cola.unshift('reciboServicios'); totalPasos++; }
  pintaBtnRegistros();
  avanzar();
}

/* Deja el registro en curso aparcado y abre otro, o empieza uno nuevo.
   Nada se pierde: cada uno guarda su propio avance. */
function empiezaNuevo(){
  Object.keys(datos).forEach(k=>{ delete datos[k]; });
  Object.assign(datos, JSON.parse(JSON.stringify(DATOS_VACIOS)));
  fijaBorradorDePestana(null);
  historial = [];
  sinAtras = false;
  cola = []; totalPasos = 0; pasosHechos = 0;
  pintaProgreso();
  pintaBtnRegistros();
  mostrarPaso('tipoRegistro');
}
function menuRegistros(saludo){
  const otros = otrosBorradores();
  if(!otros.length){ empiezaNuevo(); return; }
  /* Lo que está en curso se guarda antes de soltarlo */
  if(borradorActual && cola.length) guardaBorrador(cola[0] || 'resumen');
  burbujaBot(saludo || '¿Cuál abres en esta pestaña? 📋<span class="peque">Todo se guarda solo. Puedes tener varios a medio llenar y cambiar entre ellos cuando quieras.</span>').then(()=>{
    dockChips(opcionesDeBorradores(otros), true);
  });
}

/* Los chips de la lista de registros. Se usan igual al arrancar y al tocar «⇄»,
   para que digan lo mismo en los dos sitios. */
function opcionesDeBorradores(lista){
  const ops = lista.map(b=>{
    const ocupado = abiertoEnOtraPestana(b);
    return {
      t:'📋 '+escapa(tituloBorrador(b))+'<span class="peque">'+cuandoBorrador(b)+
        (ocupado ? ' · <b>abierto en otra pestaña</b>' : '')+
        (b.sinFotos ? ' · sin fotos, se vuelven a pedir' : '')+'</span>',
      fn:()=>{
        burbujaUser('📋 '+tituloBorrador(b));
        dockLimpiar();
        /* Abrir el mismo registro en dos pestañas termina en que una pisa lo
           que escribió la otra. Se avisa antes, no después. */
        if(ocupado){
          burbujaBot('⚠️ Ese registro lo estás llenando en <b>otra pestaña</b>.'+
            '<span class="peque">Si lo abres también aquí, lo que escribas en una puede pisar lo de la otra. '+
            'Mejor vuelve a esa pestaña, o empieza uno nuevo aquí.</span>').then(()=>{
            dockChips([
              {t:'↩️ Mejor elijo otro', clase:'primario', fn:()=>{
                burbujaUser('↩️ Mejor elijo otro'); dockLimpiar(); menuRegistros(); }},
              {t:'⚠️ Abrirlo aquí de todos modos', clase:'secund ancho', fn:()=>{
                burbujaUser('⚠️ Abrirlo aquí de todos modos'); dockLimpiar(); restauraBorrador(b); }}
            ], true);
          });
          return;
        }
        restauraBorrador(b);
      }
    };
  });
  ops.push({t:'➕ Empezar uno nuevo aquí', clase:'primario ancho', fn:()=>{
    burbujaUser('➕ Empezar uno nuevo aquí'); dockLimpiar(); empiezaNuevo(); }});
  /* Borrar es de a uno y con confirmación: en bloque se llevaba por delante
     trabajo de otra pestaña sin que se notara. */
  ops.push({t:'🗑️ Borrar alguno de la lista', clase:'secund ancho', fn:()=>{
    burbujaUser('🗑️ Borrar alguno de la lista'); dockLimpiar(); menuBorrarBorrador(lista); }});
  return ops;
}

function menuBorrarBorrador(lista){
  burbujaBot('¿Cuál borras? <span class="peque">Se pierde lo que tenga escrito. Los demás siguen igual.</span>').then(()=>{
    const ops = lista.map(b=>({
      t:'🗑️ '+escapa(tituloBorrador(b))+'<span class="peque">'+cuandoBorrador(b)+'</span>',
      fn:()=>{
        burbujaUser('🗑️ '+tituloBorrador(b));
        dockLimpiar();
        burbujaBot('¿Seguro que borras <b>'+escapa(tituloBorrador(b))+'</b>?').then(()=>{
          dockChips([
            {t:'🗑️ Sí, borrarlo', clase:'secund', fn:()=>{
              burbujaUser('🗑️ Sí, borrarlo');
              const m = leeBorradores(); delete m[b.id];
              escribeBorradores(m); pintaBtnRegistros();
              dockLimpiar();
              burbujaBot('Borrado.').then(()=>volverDeLaLista());
            }},
            {t:'↩️ No, dejarlo', clase:'primario', fn:()=>{
              burbujaUser('↩️ No, dejarlo'); dockLimpiar(); volverDeLaLista(); }}
          ]);
        });
      }
    }));
    ops.push({t:'↩️ Volver', clase:'primario ancho', fn:()=>{
      burbujaUser('↩️ Volver'); dockLimpiar(); volverDeLaLista(); }});
    dockChips(ops, true);
  });
}
/* Después de borrar o cancelar: si esta pestaña ya tenía un registro, sigue
   con él; si no, vuelve a la lista. */
function volverDeLaLista(){
  if(borradorActual && cola.length){ mostrarPaso(cola[0]); return; }
  const otros = otrosBorradores();
  if(otros.length) menuRegistros();
  else empiezaNuevo();
}

(async function(){
  pintaProgreso();
  await cargaCatalogo();
  const m = leeBorradores();
  const lista = Object.keys(m).map(k=>m[k])
                  .filter(b=>b && b.cola && b.cola.length)
                  .sort((a,b)=>(b.actualizado||0)-(a.actualizado||0));

  /* 1. Esta pestaña ya venía llenando uno: se retoma sin preguntar nada. Es lo
        que hace que recargar —o volver a la pestaña— sea indoloro, y lo que
        permite tener varias abiertas cada una en lo suyo. */
  /* Viene de «hacer otro registro»: pantalla en blanco, sin menú */
  if(ssGet('rw_otro_en_blanco')){
    ssDel('rw_otro_en_blanco');
    await burbujaBot('Listo 🙌 Vamos con el siguiente.'+
      (lista.length ? '<span class="peque">Tus '+lista.length+' registro'+(lista.length===1?'':'s')+
        ' a medio llenar siguen guardados: el botón ⇄ los abre.</span>' : ''));
    cola = []; totalPasos = 0;
    mostrarPaso('tipoRegistro');
    return;
  }

  const mio = borradorDeEstaPestana();
  const elMio = mio ? lista.find(b=>b.id === mio) : null;
  if(elMio){
    await burbujaBot('Seguimos con <b>'+escapa(tituloBorrador(elMio))+'</b> 👇'+
      (lista.length > 1 ? '<span class="peque">Tus otros '+(lista.length-1)+
        ' registro'+(lista.length-1===1?'':'s')+' siguen guardados; el botón ⇄ los abre.</span>' : ''));
    restauraBorrador(elMio);
    return;
  }

  /* 2. Pestaña nueva con registros a medio llenar: se elige, y punto. No se
        pregunta por guardar —todo se guarda solo— ni por descartar. */
  if(lista.length){
    await burbujaBot('¡Hola! 👋 Tienes <b>'+lista.length+' registro'+(lista.length===1?'':'s')+
      ' a medio llenar</b>.');
    menuRegistros('¿Cuál abres en esta pestaña? 📋<span class="peque">Todo se guarda solo. '+
      'Puedes dejar uno a medias, abrir otro en una pestaña nueva y volver cuando quieras.</span>');
    return;
  }

  /* 3. Nada empezado: el saludo de siempre. */
  await burbujaBot('¡Hola! 👋 Soy el asistente de <b>registro del equipo</b>.<span class="peque">Te haré unas preguntas cortas, una por una. Si no cuentas con algún dato, descuida: <b>tu avance se guarda automáticamente</b> y puedes volver a este mismo link cuando lo tengas para continuar donde quedaste.<br>¿Necesitas llenar varios a la vez? Abre este link en otra pestaña y elige «empezar uno nuevo»: cada pestaña lleva el suyo.</span>');
  cola = [];
  totalPasos = 0;
  mostrarPaso('tipoRegistro');
})();
</script>
